<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Estante - Ensino Fácil</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(180deg, #FAF3E8 0%, #F0E2CC 100%);
    color: #3D2314;
    min-height: 100vh;
  }
  header {
    background: rgba(250, 243, 232, 0.9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #E4D2B7;
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo {
    font-size: 22px;
    font-weight: bold;
    color: #3D2314;
    text-decoration: none;
  }
  .logo span { color: #8B5E3C; }
  .sair {
    background: transparent;
    border: 1px solid #8B5E3C;
    color: #8B5E3C;
    padding: 8px 16px;
    border-radius: 999px;
    font-family: Arial, sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .sair:hover {
    background: #8B5E3C;
    color: #FAF3E8;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }
  .cabecalho {
    margin-bottom: 30px;
  }
  .cabecalho h1 {
    font-size: 34px;
    color: #3D2314;
    margin-bottom: 6px;
  }
  .cabecalho p {
    font-family: Arial, sans-serif;
    font-size: 14px;
    color: #8B5E3C;
  }
  .estante-titulo {
    font-size: 20px;
    color: #3D2314;
    font-weight: bold;
    margin-bottom: 14px;
    padding-left: 4px;
  }
  .fileira {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding: 4px 4px 14px 4px;
  }
  .fileira::-webkit-scrollbar { height: 6px; }
  .fileira::-webkit-scrollbar-thumb { background: #C9A961; border-radius: 3px; }
  .prateleira-madeira {
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(180deg, #8B5E3C 0%, #6B4423 60%, #3D2314 100%);
    box-shadow: 0 6px 12px -4px rgba(61,35,20,0.45);
    margin-top: -4px;
    margin-bottom: 30px;
  }
  .produto {
    width: 160px;
    flex-shrink: 0;
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s;
    cursor: pointer;
  }
  .produto:hover { transform: translateY(-4px); }
  .produto .capa {
    aspect-ratio: 3/4;
    background: #E4D2B7;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #E4D2B7;
    box-shadow: 0 4px 14px -4px rgba(61,35,20,0.20);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    position: relative;
  }
  .produto .capa img { width: 100%; height: 100%; object-fit: cover; }
  .produto .capa::after {
    content: "ABRIR";
    position: absolute;
    top: 8px;
    right: 8px;
    background: #6B4423;
    color: #FAF3E8;
    font-size: 9px;
    padding: 3px 8px;
    border-radius: 999px;
    font-family: Arial, sans-serif;
    letter-spacing: 0.5px;
    font-weight: bold;
  }
  .produto .titulo {
    font-size: 13px;
    font-weight: bold;
    color: #3D2314;
    line-height: 1.3;
    padding: 8px 4px 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .vazio {
    text-align: center;
    color: #8B5E3C;
    font-family: Arial, sans-serif;
    padding: 80px 20px;
    background: rgba(240, 226, 204, 0.5);
    border-radius: 16px;
    border: 2px dashed #C9A961;
  }
  .vazio .emoji { font-size: 60px; margin-bottom: 16px; }
  .vazio h2 {
    color: #3D2314;
    font-family: 'Georgia', serif;
    font-size: 24px;
    margin-bottom: 8px;
  }
  .vazio p { font-size: 15px; line-height: 1.6; }
  .vazio a {
    display: inline-block;
    margin-top: 24px;
    padding: 14px 32px;
    background: #6B4423;
    color: #FAF3E8;
    text-decoration: none;
    border-radius: 999px;
    font-weight: bold;
    font-family: 'Georgia', serif;
    transition: all 0.2s;
  }
  .vazio a:hover { background: #3D2314; }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">📖 Ensino <span>Fácil</span></a>
  <button class="sair" onclick="sair()">Sair</button>
</header>

<main>
  <div class="cabecalho">
    <h1 id="titulo">Minha Estante</h1>
    <p id="subtitulo">Carregando...</p>
  </div>

  <div id="conteudo"></div>
</main>

<script>
  const SUPABASE_URL = "https://lfepiujvufjbufzblnke.supabase.co";
  const SUPABASE_KEY = "sb_publishable_gtzU89_Ygs146r-beP3nHA_nIEdFK8j";

  const token = localStorage.getItem('ef_token');
  const userRaw = localStorage.getItem('ef_user');

  // Se não estiver logado, manda pra tela de entrar
  if (!token || !userRaw) {
    window.location.href = 'entrar.html';
  }

  const user = JSON.parse(userRaw);
  const nome = (user.user_metadata && user.user_metadata.nome) || 'amiga(o)';

  document.getElementById('titulo').textContent = 'Olá, ' + nome + '!';
  document.getElementById('subtitulo').textContent = 'Esta é a sua estante pessoal de conhecimentos';

  async function carregar() {
    const conteudo = document.getElementById('conteudo');

    try {
      // Buscar produtos comprados pelo usuário
      const res = await fetch(
        SUPABASE_URL + '/rest/v1/biblioteca?select=produto_id,produtos(*)&user_id=eq.' + user.id,
        {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + token
          }
        }
      );
      const itens = await res.json();

      if (!itens || itens.length === 0) {
        conteudo.innerHTML = `
          <div class="vazio">
            <div class="emoji">📚</div>
            <h2>Sua estante está vazia</h2>
            <p>Quando você comprar um e-book ou videoaula,<br>ele vai aparecer aqui para sempre.</p>
            <a href="index.html">Explorar categorias</a>
          </div>
        `;
        return;
      }

      const produtos = itens.map(i => i.produtos).filter(p => p);

      conteudo.innerHTML = `
        <div class="estante-titulo">📖 Meus materiais (${produtos.length})</div>
        <div class="fileira">
          ${produtos.map(p => `
            <a class="produto" href="${p.arquivo_url || p.link_externo || '#'}" target="_blank">
              <div class="capa">
                ${p.capa_url ? `<img src="${p.capa_url}" alt="${p.titulo}">` : '📖'}
              </div>
              <div class="titulo">${p.titulo}</div>
            </a>
          `).join('')}
        </div>
        <div class="prateleira-madeira"></div>
      `;

    } catch (e) {
      conteudo.innerHTML = '<div class="vazio">Erro ao carregar sua estante.</div>';
    }
  }

  function sair() {
    localStorage.removeItem('ef_token');
    localStorage.removeItem('ef_user');
    window.location.href = 'index.html';
  }

  carregar();
</script>

</body>
</html>
