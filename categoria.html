<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categoria - Ensino Fácil</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(180deg, #FAF3E8 0%, #F0E2CC 100%);
    color: #3D2314;
    min-height: 100vh;
  }
  header {
    background: rgba(250, 243, 232, 0.9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #E4D2B7;
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo {
    font-size: 22px;
    font-weight: bold;
    color: #3D2314;
    text-decoration: none;
  }
  .logo span { color: #8B5E3C; }
  main { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }
  .cabecalho {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 30px;
  }
  .cabecalho .emoji { font-size: 52px; }
  .cabecalho h1 {
    font-size: 34px;
    color: #3D2314;
  }
  .estante {
    margin-bottom: 40px;
  }
  .estante .titulo-linha {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    padding: 0 4px;
  }
  .estante .nome-loja {
    font-size: 20px;
    color: #3D2314;
    font-weight: bold;
  }
  .estante .ver-tudo {
    font-size: 13px;
    color: #8B5E3C;
    text-decoration: none;
    font-family: Arial, sans-serif;
  }
  .estante .ver-tudo:hover { color: #3D2314; }
  .fileira {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding: 4px 4px 14px 4px;
  }
  .fileira::-webkit-scrollbar { height: 6px; }
  .fileira::-webkit-scrollbar-thumb { background: #C9A961; border-radius: 3px; }
  .prateleira-madeira {
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(180deg, #8B5E3C 0%, #6B4423 60%, #3D2314 100%);
    box-shadow: 0 6px 12px -4px rgba(61,35,20,0.45);
    margin-top: -4px;
    margin-bottom: 4px;
  }
  .produto {
    width: 160px;
    flex-shrink: 0;
    text-decoration: none;
    color: inherit;
    transition: transform 0.2s;
  }
  .produto:hover { transform: translateY(-4px); }
  .produto .capa {
    aspect-ratio: 3/4;
    background: #E4D2B7;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #E4D2B7;
    box-shadow: 0 4px 14px -4px rgba(61,35,20,0.20);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
  }
  .produto .capa img { width: 100%; height: 100%; object-fit: cover; }
  .produto .info {
    padding: 8px 4px 0;
  }
  .produto .titulo {
    font-size: 13px;
    font-weight: bold;
    color: #3D2314;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .produto .preco {
    font-size: 12px;
    color: #8B5E3C;
    margin-top: 4px;
    font-family: Arial, sans-serif;
  }
  .vazio {
    text-align: center;
    color: #8B5E3C;
    font-family: Arial, sans-serif;
    padding: 60px 20px;
    background: rgba(240, 226, 204, 0.5);
    border-radius: 16px;
    border: 2px dashed #C9A961;
  }
  .voltar {
    display: inline-block;
    margin-bottom: 20px;
    color: #8B5E3C;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 14px;
  }
  .voltar:hover { color: #3D2314; }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">📖 Ensino <span>Fácil</span></a>
</header>

<main>
  <a href="index.html" class="voltar">← Voltar</a>

  <div class="cabecalho" id="cabecalho">
    <div class="emoji">🧁</div>
    <h1>Carregando...</h1>
  </div>

  <div id="conteudo"></div>
</main>

<script>
  const SUPABASE_URL = "https://lfepiujvufjbufzblnke.supabase.co";
  const SUPABASE_KEY = "sb_publishable_gtzU89_Ygs146r-beP3nHA_nIEdFK8j";

  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY
  };

  function precoBR(cents) {
    return (cents / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  async function carregar() {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    const cabecalho = document.getElementById('cabecalho');
    const conteudo = document.getElementById('conteudo');

    if (!slug) {
      cabecalho.innerHTML = '<h1>Categoria não encontrada</h1>';
      return;
    }

    try {
      // 1) Buscar a categoria
      const resCat = await fetch(
        SUPABASE_URL + '/rest/v1/categorias?select=*&slug=eq.' + slug,
        { headers }
      );
      const cats = await resCat.json();

      if (!cats || cats.length === 0) {
        cabecalho.innerHTML = '<h1>Categoria não encontrada</h1>';
        return;
      }

      const cat = cats[0];
      cabecalho.innerHTML = `
        <div class="emoji">${cat.emoji || '📚'}</div>
        <h1>${cat.nome}</h1>
      `;

      // 2) Buscar lojas dessa categoria
      const resLojas = await fetch(
        SUPABASE_URL + '/rest/v1/lojas?select=*&ativo=eq.true',
        { headers }
      );
      const lojas = await resLojas.json();

      if (!lojas || lojas.length === 0) {
        conteudo.innerHTML = `
          <div class="vazio">
            <p style="font-size:48px;margin-bottom:12px;">🧁</p>
            <p>Em breve, novas lojas nessa prateleira!</p>
          </div>
        `;
        return;
      }

      // 3) Para cada loja, buscar produtos
      let html = '';
      for (const loja of lojas) {
        const resProd = await fetch(
          SUPABASE_URL + '/rest/v1/produtos?select=*&loja_id=eq.' + loja.id + '&ativo=eq.true&order=ordem.asc',
          { headers }
        );
        const produtos = await resProd.json();

        if (!produtos || produtos.length === 0) continue;

        html += `
          <div class="estante">
            <div class="titulo-linha">
              <div class="nome-loja">${loja.nome}</div>
              <a href="loja.html?slug=${loja.slug}" class="ver-tudo">ver tudo →</a>
            </div>
            <div class="fileira">
              ${produtos.map(p => `
                <a class="produto" href="produto.html?id=${p.id}">
                  <div class="capa">
                    ${p.capa_url ? `<img src="${p.capa_url}" alt="${p.titulo}">` : '📖'}
                  </div>
                  <div class="info">
                    <div class="titulo">${p.titulo}</div>
                    <div class="preco">${precoBR(p.preco_cents)}</div>
                  </div>
                </a>
              `).join('')}
            </div>
            <div class="prateleira-madeira"></div>
          </div>
        `;
      }

      if (html === '') {
        conteudo.innerHTML = `
          <div class="vazio">
            <p style="font-size:48px;margin-bottom:12px;">🧁</p>
            <p>Em breve, novas lojas nessa prateleira!</p>
          </div>
        `;
      } else {
        conteudo.innerHTML = html;
      }

    } catch (e) {
      conteudo.innerHTML = '<div class="vazio">Erro ao carregar.</div>';
    }
  }

  carregar();
</script>

</body>
</html>
