<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar - Ensino Fácil</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(180deg, #FAF3E8 0%, #F0E2CC 100%);
    color: #3D2314;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: rgba(250, 243, 232, 0.9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #E4D2B7;
    padding: 14px 20px;
  }
  .logo {
    font-size: 22px;
    font-weight: bold;
    color: #3D2314;
    text-decoration: none;
  }
  .logo span { color: #8B5E3C; }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .card {
    background: #FAF3E8;
    border: 1px solid #E4D2B7;
    border-radius: 20px;
    padding: 40px 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 24px -8px rgba(61,35,20,0.25);
  }
  .card h1 {
    font-size: 28px;
    color: #3D2314;
    margin-bottom: 6px;
    text-align: center;
  }
  .card .sub {
    font-family: Arial, sans-serif;
    font-size: 14px;
    color: #8B5E3C;
    text-align: center;
    margin-bottom: 28px;
  }
  .abas {
    display: flex;
    gap: 8px;
    background: #F0E2CC;
    padding: 4px;
    border-radius: 999px;
    margin-bottom: 24px;
  }
  .aba {
    flex: 1;
    padding: 10px;
    text-align: center;
    border-radius: 999px;
    cursor: pointer;
    font-family: Arial, sans-serif;
    font-size: 14px;
    color: #8B5E3C;
    border: none;
    background: transparent;
    transition: all 0.2s;
  }
  .aba.ativa {
    background: #6B4423;
    color: #FAF3E8;
    font-weight: bold;
  }
  .campo {
    margin-bottom: 16px;
  }
  .campo label {
    display: block;
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: #6B4423;
    margin-bottom: 6px;
    font-weight: bold;
  }
  .campo input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #E4D2B7;
    border-radius: 12px;
    background: #FFFFFF;
    font-size: 15px;
    font-family: Arial, sans-serif;
    color: #3D2314;
    outline: none;
    transition: border 0.2s;
  }
  .campo input:focus {
    border-color: #C9A961;
  }
  .btn {
    width: 100%;
    padding: 16px;
    background: #6B4423;
    color: #FAF3E8;
    border: none;
    border-radius: 999px;
    font-size: 16px;
    font-weight: bold;
    font-family: 'Georgia', serif;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }
  .btn:hover:not(:disabled) {
    background: #3D2314;
  }
  .btn:disabled {
    background: #C9A961;
    cursor: not-allowed;
  }
  .mensagem {
    margin-top: 18px;
    padding: 12px 16px;
    border-radius: 10px;
    font-family: Arial, sans-serif;
    font-size: 13px;
    text-align: center;
    display: none;
    word-break: break-word;
  }
  .mensagem.sucesso {
    display: block;
    background: #E8F5E9;
    color: #2E7D32;
    border: 1px solid #A5D6A7;
  }
  .mensagem.erro {
    display: block;
    background: #FFEBEE;
    color: #C62828;
    border: 1px solid #EF9A9A;
  }
  .esqueci {
    text-align: center;
    margin-top: 16px;
  }
  .esqueci a {
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: #8B5E3C;
    text-decoration: none;
  }
  .esqueci a:hover { color: #3D2314; }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">📖 Ensino <span>Fácil</span></a>
</header>

<main>
  <div class="card">
    <h1>Bem-vindo(a)</h1>
    <p class="sub">Acesse sua estante de conhecimentos</p>

    <div class="abas">
      <button class="aba ativa" id="abaEntrar" onclick="trocarAba('entrar')">Entrar</button>
      <button class="aba" id="abaCriar" onclick="trocarAba('criar')">Criar conta</button>
    </div>

    <div id="campoNome" class="campo" style="display:none;">
      <label>Seu nome</label>
      <input type="text" id="nome" placeholder="Como quer ser chamada(o)?">
    </div>

    <div id="campoWhats" class="campo" style="display:none;">
      <label>WhatsApp (com DDD)</label>
      <input type="tel" id="whatsapp" placeholder="(11) 99999-9999">
    </div>

    <div class="campo">
      <label>E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com">
    </div>

    <div class="campo">
      <label>Senha</label>
      <input type="password" id="senha" placeholder="Mínimo 6 caracteres">
    </div>

    <button class="btn" id="btnAcao" onclick="executar()">Entrar</button>

    <div class="mensagem" id="mensagem"></div>

    <div class="esqueci">
      <a href="#">Esqueci minha senha</a>
    </div>
  </div>
</main>

<script>
  const SUPABASE_URL = "https://lfepiujvufjbufzblnke.supabase.co";
  const SUPABASE_KEY = "sb_publishable_gtzU89_Ygs146r-beP3nHA_nIEdFK8j";

  let modo = 'entrar';

  function trocarAba(novoModo) {
    modo = novoModo;
    document.getElementById('abaEntrar').classList.toggle('ativa', modo === 'entrar');
    document.getElementById('abaCriar').classList.toggle('ativa', modo === 'criar');
    document.getElementById('campoNome').style.display = modo === 'criar' ? 'block' : 'none';
    document.getElementById('campoWhats').style.display = modo === 'criar' ? 'block' : 'none';
    document.getElementById('btnAcao').textContent = modo === 'criar' ? 'Criar minha conta' : 'Entrar';
    esconderMensagem();
  }

  function mostrarMensagem(texto, tipo) {
    const el = document.getElementById('mensagem');
    el.textContent = texto;
    el.className = 'mensagem ' + tipo;
  }

  function esconderMensagem() {
    const el = document.getElementById('mensagem');
    el.className = 'mensagem';
    el.textContent = '';
  }

  async function executar() {
    const nome = document.getElementById('nome').value.trim();
    const whatsapp = document.getElementById('whatsapp').value.trim();
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;
    const btn = document.getElementById('btnAcao');

    esconderMensagem();

    if (!email || !senha) {
      mostrarMensagem('Preencha o e-mail e a senha.', 'erro');
      return;
    }

    if (senha.length < 6) {
      mostrarMensagem('A senha precisa ter pelo menos 6 caracteres.', 'erro');
      return;
    }

    if (modo === 'criar' && !nome) {
      mostrarMensagem('Digite seu nome.', 'erro');
      return;
    }

    if (modo === 'criar' && !whatsapp) {
      mostrarMensagem('Digite seu WhatsApp com DDD.', 'erro');
      return;
    }

    btn.disabled = true;
    btn.textContent = modo === 'criar' ? 'Criando...' : 'Entrando...';

    try {
      if (modo === 'criar') {
        // === CRIAR CONTA ===
        const res = await fetch(SUPABASE_URL + '/auth/v1/signup', {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: email,
            password: senha,
            data: {
              nome: nome,
              whatsapp: whatsapp
            }
          })
        });
        const data = await res.json();

        // Mostra TUDO que veio do servidor (pra descobrir o erro real)
        if (!res.ok || data.error || data.msg) {
          const erroDetalhado = JSON.stringify(data, null, 2);
          mostrarMensagem('Erro: ' + (data.error_description || data.msg || data.error || erroDetalhado), 'erro');
          btn.disabled = false;
          btn.textContent = 'Criar minha conta';
          return;
        }

        mostrarMensagem('Conta criada com sucesso! Agora faça login. ✅', 'sucesso');
        btn.disabled = false;
        btn.textContent = 'Criar minha conta';

      } else {
        // === ENTRAR ===
        const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email: email, password: senha })
        });
        const data = await res.json();

        if (!data.access_token) {
          mostrarMensagem('Erro no login: ' + (data.error_description || data.error || JSON.stringify(data)), 'erro');
          btn.disabled = false;
          btn.textContent = 'Entrar';
          return;
        }

        localStorage.setItem('ef_token', data.access_token);
        localStorage.setItem('ef_user', JSON.stringify(data.user));

        mostrarMensagem('Login feito! Redirecionando... 🎉', 'sucesso');
        setTimeout(() => {
          window.location.href = 'minha-biblioteca.html';
        }, 1000);
      }

    } catch (e) {
      mostrarMensagem('Erro de conexão: ' + e.message, 'erro');
      btn.disabled = false;
      btn.textContent = modo === 'criar' ? 'Criar minha conta' : 'Entrar';
    }
  }
</script>

</body>
</html>
