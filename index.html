<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ensino Fácil</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(180deg, #FAF3E8 0%, #F0E2CC 100%);
    color: #3D2314;
    min-height: 100vh;
  }
  header {
    background: rgba(250, 243, 232, 0.9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #E4D2B7;
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .logo { font-size: 22px; font-weight: bold; color: #3D2314; text-decoration: none; }
  .logo span { color: #8B5E3C; }
  .menu {
    display: flex;
    gap: 10px;
    align-items: center;
    font-family: Arial, sans-serif;
  }
  .menu a, .menu button {
    text-decoration: none;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    font-family: Arial, sans-serif;
  }
  .btn-estante {
    background: #C9A961;
    color: #FAF3E8;
    font-weight: bold;
  }
  .btn-estante:hover { background: #8B5E3C; }
  .btn-sair {
    background: transparent;
    border: 1px solid #8B5E3C !important;
    color: #8B5E3C;
  }
  .btn-sair:hover { background: #8B5E3C; color: #FAF3E8; }
  .btn-entrar {
    background: #6B4423;
    color: #FAF3E8;
    font-weight: bold;
  }
  .btn-entrar:hover { background: #3D2314; }
  main { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
  h1 {
    font-size: 42px;
    text-align: center;
    color: #3D2314;
    margin-bottom: 8px;
  }
  .sub {
    text-align: center;
    color: #8B5E3C;
    margin-bottom: 40px;
    font-family: Arial, sans-serif;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
  }
  .card {
    background: #F0E2CC;
    border: 1px solid #E4D2B7;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 4px 14px -4px rgba(61,35,20,0.20);
    transition: all 0.3s;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px -8px rgba(61,35,20,0.45);
  }
  .card .capa {
    aspect-ratio: 4/3;
    background: linear-gradient(135deg, #F0E2CC 0%, #E4D2B7 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
  }
  .card .nome {
    background: #6B4423;
    color: #FAF3E8;
    padding: 12px 16px;
    font-size: 17px;
  }
  .vazio {
    text-align: center;
    color: #8B5E3C;
    font-family: Arial, sans-serif;
    padding: 40px;
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">📖 Ensino <span>Fácil</span></a>
  <div class="menu" id="menu"></div>
</header>

<main>
  <h1>Ensino Fácil</h1>
  <p class="sub">Escolha uma prateleira e comece a aprender</p>
  <div class="grid" id="lista-categorias">
    <p class="vazio">Carregando...</p>
  </div>
</main>

<script>
  const SUPABASE_URL = "https://lfepiujvufjbufzblnke.supabase.co";
  const SUPABASE_KEY = "sb_publishable_gtzU89_Ygs146r-beP3nHA_nIEdFK8j";

  // ==== MENU (login ou estante) ====
  const token = localStorage.getItem('ef_token');
  const userRaw = localStorage.getItem('ef_user');
  const menu = document.getElementById('menu');

  if (token && userRaw) {
    // Usuário logado
    const user = JSON.parse(userRaw);
    const nome = (user.user_metadata && user.user_metadata.nome) || 'você';
    menu.innerHTML = `
      <span style="color:#8B5E3C;font-size:13px;">Olá, ${nome.split(' ')[0]}!</span>
      <a href="minha-biblioteca.html" class="btn-estante">📚 Minha Estante</a>
      <button class="btn-sair" onclick="sair()">Sair</button>
    `;
  } else {
    // Não logado
    menu.innerHTML = `
      <a href="entrar.html" class="btn-entrar">Entrar</a>
    `;
  }

  function sair() {
    localStorage.removeItem('ef_token');
    localStorage.removeItem('ef_user');
    window.location.href = 'index.html';
  }

  // ==== CARREGAR CATEGORIAS ====
  async function carregarCategorias() {
    const lista = document.getElementById('lista-categorias');
    try {
      const res = await fetch(
        SUPABASE_URL + '/rest/v1/categorias?select=*&ativo=eq.true&order=ordem.asc',
        {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY
          }
        }
      );
      const data = await res.json();

      if (!data || data.length === 0) {
        lista.innerHTML = '<p class="vazio">Nenhuma categoria ainda...</p>';
        return;
      }

      lista.innerHTML = data.map(cat => `
        <a class="card" href="categoria.html?slug=${cat.slug}">
          <div class="capa">${cat.emoji || '📚'}</div>
          <div class="nome">${cat.nome}</div>
        </a>
      `).join('');
    } catch (e) {
      lista.innerHTML = '<p class="vazio">Erro ao carregar.</p>';
    }
  }

  carregarCategorias();
</script>

</body>
</html>
