<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ensino Fácil</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(180deg, #FAF3E8 0%, #F0E2CC 100%);
    color: #3D2314;
    min-height: 100vh;
  }
  header {
    background: rgba(250, 243, 232, 0.9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #E4D2B7;
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .logo { font-size: 22px; font-weight: bold; color: #3D2314; text-decoration: none; }
  .logo span { color: #8B5E3C; }
  .menu {
    display: flex;
    gap: 8px;
    align-items: center;
    font-family: Arial, sans-serif;
    flex-wrap: wrap;
  }
  .menu a, .menu button {
    text-decoration: none;
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    font-family: Arial, sans-serif;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .btn-estante { background: #C9A961; color: #FAF3E8; font-weight: bold; }
  .btn-estante:hover { background: #8B5E3C; }
  .btn-conta { background: #8B5E3C; color: #FAF3E8; font-weight: bold; }
  .btn-conta:hover { background: #6B4423; }
  .btn-sair {
    background: transparent;
    border: 1px solid #8B5E3C !important;
    color: #8B5E3C;
  }
  .btn-sair:hover { background: #8B5E3C; color: #FAF3E8; }
  .btn-entrar {
    background: #6B4423;
    color: #FAF3E8;
    font-weight: bold;
  }
  .btn-entrar:hover { background: #3D2314; }
  .saudacao { color: #8B5E3C; font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
  h1 {
    font-size: 42px;
    text-align: center;
    color: #3D2314;
    margin-bottom: 8px;
  }
  .sub {
    text-align: center;
    color: #8B5E3C;
    margin-bottom: 40px;
    font-family: Arial, sans-serif;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
  }
  .card {
    background: #F0E2CC;
    border: 1px solid #E4D2B7;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 4px 14px -4px rgba(61,35,20,0.20);
    transition: all 0.3s;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px -8px rgba(61,35,20,0.45);
  }
  .card .capa {
    aspect-ratio: 4/3;
    background: linear-gradient(135deg, #F0E2CC 0%, #E4D2B7 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
  }
  .card .nome {
    background: #6B4423;
    color: #FAF3E8;
    padding: 12px 16px;
    font-size: 17px;
  }
  .vazio {
    text-align: center;
    color: #8B5E3C;
    font-family: Arial, sans-serif;
    padding: 40px;
  }

  /* FOTO PEQUENA DO USUÁRIO NO MENU */
  .avatar-mini {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #E4D2B7 0%, #C9A961 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    overflow: hidden;
    border: 2px solid #FAF3E8;
    box-shadow: 0 2px 6px rgba(61,35,20,0.2);
    flex-shrink: 0;
  }
  .avatar-mini img { width: 100%; height: 100%; object-fit: cover; }

  @media (max-width: 600px) {
    h1 { font-size: 32px; }
    .saudacao { display: none; }
    .menu a, .menu button { padding: 8px 12px; font-size: 12px; }
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">📖 Ensino <span>Fácil</span></a>
  <div class="menu" id="menu"></div>
</header>

<main>
  <h1>Ensino Fácil</h1>
  <p class="sub">Escolha uma prateleira e comece a aprender</p>
  <div class="grid" id="lista-categorias">
    <p class="vazio">Carregando...</p>
  </div>
</main>

<script>
  const SUPABASE_URL = "https://lfepiujvufjbufzblnke.supabase.co";
  const SUPABASE_KEY = "sb_publishable_gtzU89_Ygs146r-beP3nHA_nIEdFK8j";

  // ===== MENU (logado / deslogado) =====
  const token = localStorage.getItem('ef_token');
  const userRaw = localStorage.getItem('ef_user');
  const menu = document.getElementById('menu');

  if (token && userRaw) {
    const user = JSON.parse(userRaw);
    const nome = (user.user_metadata && user.user_metadata.nome) || 'você';
    const fotoUrl = user.user_metadata && user.user_metadata.foto_url;

    menu.innerHTML = `
      <span class="saudacao">Olá, ${nome.split(' ')[0]}!</span>
      <a href="minha-biblioteca.html" class="btn-estante">📚 Minha Estante</a>
      <a href="minha-conta.html" class="btn-conta">
        ${fotoUrl ? `<span class="avatar-mini"><img src="${fotoUrl}"></span>` : '👤'}
        Minha Conta
      </a>
      <button class="btn-sair" onclick="sair()">Sair</button>
    `;

    // Atualiza a foto no menu caso o usuário mude em outra página
    atualizarFotoMenu(user.id);
  } else {
    menu.innerHTML = `<a href="entrar.html" class="btn-entrar">Entrar</a>`;
  }

  async function atualizarFotoMenu(id) {
    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/clientes?select=foto_url&id=eq.' + id, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        }
      });
      const lista = await res.json();
      if (lista.length > 0 && lista[0].foto_url) {
        const user = JSON.parse(localStorage.getItem('ef_user'));
        user.user_metadata = user.user_metadata || {};
        user.user_metadata.foto_url = lista[0].foto_url;
        localStorage.setItem('ef_user', JSON.stringify(user));
        // Atualiza o avatar no menu
        const btnConta = document.querySelector('.btn-conta');
        if (btnConta && !btnConta.querySelector('.avatar-mini')) {
          btnConta.innerHTML = `<span class="avatar-mini"><img src="${lista[0].foto_url}"></span> Minha Conta`;
        } else if (btnConta) {
          const img = btnConta.querySelector('.avatar-mini img');
          if (img) img.src = lista[0].foto_url;
        }
      }
    } catch (e) { /* silêncio */ }
  }

  function sair() {
    localStorage.removeItem('ef_token');
    localStorage.removeItem('ef_user');
    window.location.href = 'index.html';
  }

  // ===== CARREGAR CATEGORIAS =====
  async function carregarCategorias() {
    const lista = document.getElementById('lista-categorias');
    try {
      const res = await fetch(
        SUPABASE_URL + '/rest/v1/categorias?select=*&ativo=eq.true&order=ordem.asc',
        {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY
          }
        }
      );
      const data = await res.json();

      if (!data || data.length === 0) {
        lista.innerHTML = '<p class="vazio">Nenhuma categoria ainda...</p>';
        return;
      }

      lista.innerHTML = data.map(cat => `
        <a class="card" href="categoria.html?slug=${cat.slug}">
          <div class="capa">${cat.emoji || '📚'}</div>
          <div class="nome">${cat.nome}</div>
        </a>
      `).join('');
    } catch (e) {
      lista.innerHTML = '<p class="vazio">Erro ao carregar.</p>';
    }
  }

  carregarCategorias();
</script>

</body>
</html>
