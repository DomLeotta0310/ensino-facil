<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ensino Fácil</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(180deg, #FAF3E8 0%, #F0E2CC 100%);
    color: #3D2314;
    min-height: 100vh;
  }
  header {
    background: rgba(250, 243, 232, 0.9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #E4D2B7;
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo { font-size: 22px; font-weight: bold; color: #3D2314; }
  .logo span { color: #8B5E3C; }
  main { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
  h1 {
    font-size: 42px;
    text-align: center;
    color: #3D2314;
    margin-bottom: 8px;
  }
  .sub {
    text-align: center;
    color: #8B5E3C;
    margin-bottom: 40px;
    font-family: Arial, sans-serif;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
  }
  .card {
    background: #F0E2CC;
    border: 1px solid #E4D2B7;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 4px 14px -4px rgba(61,35,20,0.20);
    transition: all 0.3s;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px -8px rgba(61,35,20,0.45);
  }
  .card .capa {
    aspect-ratio: 4/3;
    background: linear-gradient(135deg, #F0E2CC 0%, #E4D2B7 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
  }
  .card .nome {
    background: #6B4423;
    color: #FAF3E8;
    padding: 12px 16px;
    font-size: 17px;
  }
  .vazio {
    text-align: center;
    color: #8B5E3C;
    font-family: Arial, sans-serif;
    padding: 40px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">📖 Ensino <span>Fácil</span></div>
</header>

<main>
  <h1>Ensino Fácil</h1>
  <p class="sub">Escolha uma prateleira e comece a aprender</p>
  <div class="grid" id="lista-categorias">
    <p class="vazio">Carregando...</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://lfepiujvufjbufzblnke.supabase.co";
  const SUPABASE_KEY = "sb_publishable_gtzU89_Ygs146r-beP3nHA_nIEdFK8j";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function carregarCategorias() {
    const { data, error } = await supabase
      .from('categorias')
      .select('*')
      .eq('ativo', true)
      .order('ordem');

    const lista = document.getElementById('lista-categorias');

    if (error || !data || data.length === 0) {
      lista.innerHTML = '<p class="vazio">Nenhuma categoria ainda...</p>';
      return;
    }

    lista.innerHTML = data.map(cat => `
      <a class="card" href="categoria.html?slug=${cat.slug}">
        <div class="capa">${cat.emoji || '📚'}</div>
        <div class="nome">${cat.nome}</div>
      </a>
    `).join('');
  }

  carregarCategorias();
</script>

</body>
</html>
