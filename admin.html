<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel ADM - Ensino Fácil</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #F7F3EE; color: #3D2314; min-height: 100vh; }

  #login { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(180deg, #FAF3E8 0%, #F0E2CC 100%); }
  .login-card { background: #FAF3E8; border: 1px solid #E4D2B7; border-radius: 20px; padding: 40px 32px; width: 100%; max-width: 380px; box-shadow: 0 8px 24px -8px rgba(61,35,20,0.25); text-align: center; }
  .login-card h1 { font-family: 'Georgia', serif; font-size: 26px; margin-bottom: 6px; }
  .login-card p { font-size: 13px; color: #8B5E3C; margin-bottom: 24px; }
  .login-card input { width: 100%; padding: 14px 16px; border: 1px solid #E4D2B7; border-radius: 12px; font-size: 15px; margin-bottom: 14px; outline: none; }
  .login-card input:focus { border-color: #C9A961; }
  .login-card button { width: 100%; padding: 14px; background: #6B4423; color: #FAF3E8; border: none; border-radius: 999px; font-size: 15px; font-weight: bold; cursor: pointer; font-family: 'Georgia', serif; }
  .login-card .erro { color: #C62828; font-size: 13px; margin-top: 10px; display: none; }

  #painel { display: none; }
  .topo { background: #1F2A2E; color: #FAF3E8; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
  .topo .logo { font-family: 'Georgia', serif; font-size: 20px; font-weight: bold; }
  .topo .logo span { color: #C9A961; }
  .topo button { background: transparent; border: 1px solid #FAF3E8; color: #FAF3E8; padding: 8px 16px; border-radius: 999px; cursor: pointer; font-size: 13px; }
  .topo button:hover { background: #FAF3E8; color: #1F2A2E; }

  .layout { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 56px); }
  .menu-lateral { background: #2B3A3F; padding: 20px 0; }
  .menu-lateral a { display: flex; align-items: center; gap: 10px; padding: 14px 22px; color: #C9C9C9; text-decoration: none; font-size: 14px; cursor: pointer; transition: all 0.2s; border-left: 3px solid transparent; }
  .menu-lateral a:hover { background: rgba(255,255,255,0.05); color: #fff; }
  .menu-lateral a.ativo { background: rgba(201,169,97,0.15); color: #C9A961; border-left-color: #C9A961; font-weight: bold; }

  .conteudo { padding: 30px; }
  .conteudo h2 { font-family: 'Georgia', serif; font-size: 26px; margin-bottom: 4px; }
  .conteudo .sub { color: #8B5E3C; font-size: 14px; margin-bottom: 24px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 30px; }
  .card-stat { background: #FFFFFF; border-radius: 14px; padding: 20px; box-shadow: 0 2px 8px -2px rgba(61,35,20,0.12); border-left: 4px solid #C9A961; }
  .card-stat .label { font-size: 12px; color: #8B5E3C; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .card-stat .valor { font-size: 26px; font-weight: bold; color: #3D2314; }

  .formulario { background: #FFFFFF; border-radius: 14px; padding: 24px; box-shadow: 0 2px 8px -2px rgba(61,35,20,0.12); margin-bottom: 24px; }
  .formulario h3 { font-family: 'Georgia', serif; font-size: 18px; margin-bottom: 16px; }
  .linha-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .formulario label { display: block; font-size: 12px; color: #8B5E3C; font-weight: bold; margin-bottom: 4px; }
  .formulario input, .formulario select, .formulario textarea { width: 100%; padding: 10px 12px; border: 1px solid #E4D2B7; border-radius: 8px; font-size: 14px; outline: none; font-family: Arial, sans-serif; background: #FFF; }
  .formulario textarea { resize: vertical; min-height: 70px; }
  .formulario input:focus, .formulario select:focus, .formulario textarea:focus { border-color: #C9A961; }
  .btn-primario { background: #6B4423; color: #FAF3E8; border: none; padding: 12px 28px; border-radius: 999px; font-size: 14px; font-weight: bold; cursor: pointer; font-family: 'Georgia', serif; }
  .btn-primario:hover { background: #3D2314; }
  .btn-primario:disabled { background: #C9A961; cursor: wait; }

  /* Área de upload (arrastar) */
  .upload-box { border: 2px dashed #C9A961; border-radius: 12px; padding: 20px; text-align: center; background: #FFFDF8; cursor: pointer; transition: all 0.2s; position: relative; min-height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .upload-box:hover, .upload-box.arrastando { background: #FAF3E8; border-color: #6B4423; }
  .upload-box .icone { font-size: 28px; margin-bottom: 6px; }
  .upload-box .txt { font-size: 13px; color: #6B4423; font-weight: bold; }
  .upload-box .sub-txt { font-size: 11px; color: #8B5E3C; margin-top: 4px; }
  .upload-box input[type=file] { display: none; }
  .upload-box .preview { max-width: 100%; max-height: 140px; border-radius: 8px; margin-top: 8px; }
  .upload-box .barra { width: 100%; height: 6px; background: #E4D2B7; border-radius: 3px; margin-top: 10px; overflow: hidden; display: none; }
  .upload-box .barra div { height: 100%; background: #6B4423; width: 0%; transition: width 0.3s; }
  .upload-box .remover { position: absolute; top: 6px; right: 6px; background: #FFEBEE; color: #C62828; border: 1px solid #EF9A9A; border-radius: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer; }

  .campo-url { margin-top: 8px; }
  .campo-url input { font-size: 12px; background: #F7F3EE; }
  .campo-url small { font-size: 11px; color: #8B5E3C; }

  .lista { display: grid; gap: 12px; }
  .item { background: #FFFFFF; border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px -2px rgba(61,35,20,0.10); display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .item .esquerda { display: flex; align-items: center; gap: 14px; }
  .item .capa-mini { width: 50px; height: 65px; background: #E4D2B7; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; overflow: hidden; flex-shrink: 0; }
  .item .capa-mini img { width: 100%; height: 100%; object-fit: cover; }
  .item .nome { font-weight: bold; font-size: 15px; }
  .item .detalhe { font-size: 12px; color: #8B5E3C; margin-top: 3px; }
  .item .botoes { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-acao { padding: 8px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; border: 1px solid #E4D2B7; background: #FAF3E8; color: #6B4423; text-decoration: none; font-family: Arial, sans-serif; }
  .btn-acao:hover { background: #F0E2CC; }
  .btn-zap { background: #25D366; color: #FFF; border: none; font-weight: bold; }
  .btn-zap:hover { background: #1DA851; }
  .btn-excluir { background: #FFEBEE; color: #C62828; border: 1px solid #EF9A9A; }
  .btn-excluir:hover { background: #FFCDD2; }

  .vazio-lista { text-align: center; padding: 40px; color: #8B5E3C; background: #FFFFFF; border-radius: 12px; font-size: 14px; border: 2px dashed #E4D2B7; }

  .aviso { padding: 12px 16px; background: #FFF8E1; border: 1px solid #FFE082; color: #7A5C00; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }

  .toast { position: fixed; bottom: 20px; right: 20px; background: #2E7D32; color: #FFF; padding: 14px 22px; border-radius: 10px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); z-index: 9999; display: none; }
  .toast.erro { background: #C62828; }
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <h1>🔐 Painel ADM</h1>
    <p>Ensino Fácil — Área restrita</p>
    <input type="password" id="senhaInput" placeholder="Digite a senha" onkeydown="if(event.key==='Enter')entrar()">
    <button onclick="entrar()">Entrar</button>
    <p class="erro" id="erroLogin">Senha incorreta.</p>
  </div>
</div>

<div id="painel">
  <div class="topo">
    <div class="logo">📖 Ensino <span>Fácil</span> — ADM</div>
    <button onclick="sair()">Sair</button>
  </div>

  <div class="layout">
    <nav class="menu-lateral">
      <a data-secao="dashboard" class="ativo">📊 Painel</a>
      <a data-secao="categorias">📁 Categorias</a>
      <a data-secao="lojas">🏪 Lojas</a>
      <a data-secao="produtos">📦 Produtos</a>
      <a data-secao="clientes">👥 Clientes</a>
    </nav>

    <main class="conteudo" id="conteudo"></main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SENHA = "Neriane147852@";
  const SUPABASE_URL = "https://lfepiujvufjbufzblnke.supabase.co";
  const SUPABASE_KEY = "sb_publishable_gtzU89_Ygs146r-beP3nHA_nIEdFK8j";

  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };

  let secaoAtual = 'dashboard';

  // ==== HELPERS ====
  function toast(msg, erro) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (erro ? ' erro' : '');
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3000);
  }

  function normalizarWhatsApp(num) {
    let d = (num || '').replace(/\D/g, '');
    if (!d) return '';
    // Se já começa com 55 e tem tamanho de BR (12 ou 13), mantém
    if (d.startsWith('55') && d.length >= 12) return d;
    // Se tem 10 ou 11 dígitos, adiciona 55
    if (d.length === 10 || d.length === 11) return '55' + d;
    // Caso geral: se já tem 12-13 dígitos, deixa; senão adiciona 55
    return d.length >= 12 ? d : '55' + d;
  }

  async function uploadArquivo(file, bucket) {
    const limpo = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const nome = Date.now() + '-' + limpo;
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${bucket}/${nome}`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': file.type || 'application/octet-stream',
        'x-upsert': 'true'
      },
      body: file
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error('Falha no upload: ' + err);
    }
    return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${nome}`;
  }

  // ==== LOGIN ====
  function entrar() {
    const senha = document.getElementById('senhaInput').value;
    if (senha === SENHA) {
      localStorage.setItem('ef_admin', 'ok');
      abrirPainel();
    } else {
      document.getElementById('erroLogin').style.display = 'block';
    }
  }
  function sair() {
    localStorage.removeItem('ef_admin');
    location.reload();
  }
  function abrirPainel() {
    document.getElementById('login').style.display = 'none';
    document.getElementById('painel').style.display = 'block';
    navegar('dashboard');
  }
  if (localStorage.getItem('ef_admin') === 'ok') abrirPainel();

  // ==== NAVEGAÇÃO ====
  document.querySelectorAll('.menu-lateral a').forEach(link => {
    link.addEventListener('click', () => navegar(link.dataset.secao));
  });

  function navegar(secao) {
    secaoAtual = secao;
    document.querySelectorAll('.menu-lateral a').forEach(a => a.classList.remove('ativo'));
    document.querySelector(`[data-secao="${secao}"]`).classList.add('ativo');
    if (secao === 'dashboard') renderDashboard();
    if (secao === 'categorias') renderCategorias();
    if (secao === 'lojas') renderLojas();
    if (secao === 'produtos') renderProdutos();
    if (secao === 'clientes') renderClientes();
  }

  // ==== DASHBOARD ====
  async function renderDashboard() {
    const c = document.getElementById('conteudo');
    c.innerHTML = '<h2>Painel</h2><p class="sub">Visão geral do Ensino Fácil</p><p>Carregando...</p>';
    try {
      const [cats, lojas, prods, clientes, vendas] = await Promise.all([
        fetch(SUPABASE_URL + '/rest/v1/categorias?select=id', { headers }).then(r => r.json()),
        fetch(SUPABASE_URL + '/rest/v1/lojas?select=id', { headers }).then(r => r.json()),
        fetch(SUPABASE_URL + '/rest/v1/produtos?select=id,titulo,tipo', { headers }).then(r => r.json()),
        fetch(SUPABASE_URL + '/rest/v1/clientes?select=id', { headers }).then(r => r.json()),
        fetch(SUPABASE_URL + '/rest/v1/compras?select=id', { headers }).then(r => r.json())
      ]);
      c.innerHTML = `
        <h2>Painel</h2>
        <p class="sub">Visão geral do Ensino Fácil</p>
        <div class="cards">
          <div class="card-stat"><div class="label">Categorias</div><div class="valor">${cats.length}</div></div>
          <div class="card-stat"><div class="label">Lojas</div><div class="valor">${lojas.length}</div></div>
          <div class="card-stat"><div class="label">Produtos</div><div class="valor">${prods.length}</div></div>
          <div class="card-stat"><div class="label">Clientes</div><div class="valor">${clientes.length}</div></div>
          <div class="card-stat"><div class="label">Vendas</div><div class="valor">${vendas.length}</div></div>
        </div>
        <div class="aviso">💡 <b>Em breve:</b> ranking de produtos mais vendidos e faturamento total (quando o Mercado Pago estiver ligado).</div>
      `;
    } catch (e) { c.innerHTML = '<p>Erro ao carregar.</p>'; }
  }

  // ==== CATEGORIAS ====
  async function renderCategorias() {
    const c = document.getElementById('conteudo');
    c.innerHTML = `
      <h2>Categorias</h2>
      <p class="sub">As prateleiras principais do site (Confeitaria, Pet, Moda...)</p>
      <div class="formulario">
        <h3>Nova categoria</h3>
        <div class="linha-form">
          <div><label>Nome</label><input id="catNome" placeholder="Ex: Confeitaria"></div>
          <div><label>Emoji</label><input id="catEmoji" placeholder="Ex: 🧁" maxlength="4"></div>
          <div><label>Ordem</label><input id="catOrdem" type="number" value="1"></div>
        </div>
        <button class="btn-primario" onclick="criarCategoria()">Criar categoria</button>
      </div>
      <div class="lista" id="listaCats"></div>
    `;
    carregarCats();
  }

  async function carregarCats() {
    const res = await fetch(SUPABASE_URL + '/rest/v1/categorias?select=*&order=ordem.asc', { headers });
    const lista = await res.json();
    const el = document.getElementById('listaCats');
    if (!lista.length) { el.innerHTML = '<div class="vazio-lista">Nenhuma categoria ainda.</div>'; return; }
    el.innerHTML = lista.map(cat => `
      <div class="item">
        <div class="esquerda">
          <div class="capa-mini">${cat.emoji || '📚'}</div>
          <div><div class="nome">${cat.nome}</div><div class="detalhe">slug: ${cat.slug} • ordem: ${cat.ordem}</div></div>
        </div>
        <div class="botoes"><button class="btn-acao btn-excluir" onclick="excluirCategoria('${cat.id}')">Excluir</button></div>
      </div>
    `).join('');
  }

  async function criarCategoria() {
    const nome = document.getElementById('catNome').value.trim();
    const emoji = document.getElementById('catEmoji').value.trim() || '📚';
    const ordem = parseInt(document.getElementById('catOrdem').value) || 0;
    if (!nome) { toast('Digite o nome da categoria.', true); return; }
    const slug = nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    await fetch(SUPABASE_URL + '/rest/v1/categorias', { method: 'POST', headers, body: JSON.stringify({ nome, slug, emoji, ordem, ativo: true }) });
    toast('Categoria criada! ✅');
    carregarCats();
    document.getElementById('catNome').value = '';
    document.getElementById('catEmoji').value = '';
  }

  async function excluirCategoria(id) {
    if (!confirm('Excluir essa categoria?')) return;
    await fetch(SUPABASE_URL + '/rest/v1/categorias?id=eq.' + id, { method: 'DELETE', headers });
    carregarCats();
  }

  // ==== LOJAS ====
  async function renderLojas() {
    const c = document.getElementById('conteudo');
    const cats = await fetch(SUPABASE_URL + '/rest/v1/categorias?select=*', { headers }).then(r => r.json());
    c.innerHTML = `
      <h2>Lojas</h2>
      <p class="sub">Os vendedores (Bolos e Doces da Nê, Bolo da Vovó...)</p>
      <div class="formulario">
        <h3>Nova loja</h3>
        <div class="linha-form">
          <div><label>Nome da loja</label><input id="lojaNome" placeholder="Ex: Bolos e Doces da Nê"></div>
          <div><label>Descrição</label><input id="lojaDesc" placeholder="Ex: Receitas exclusivas"></div>
          <div><label>Categoria</label>
            <select id="lojaCat">${cats.map(c => `<option value="${c.id}">${c.emoji || ''} ${c.nome}</option>`).join('')}</select>
          </div>
        </div>
        <button class="btn-primario" onclick="criarLoja()">Criar loja</button>
      </div>
      <div class="lista" id="listaLojas"></div>
    `;
    carregarLojas();
  }

  async function carregarLojas() {
    const res = await fetch(SUPABASE_URL + '/rest/v1/lojas?select=*', { headers });
    const lista = await res.json();
    const el = document.getElementById('listaLojas');
    if (!lista.length) { el.innerHTML = '<div class="vazio-lista">Nenhuma loja ainda.</div>'; return; }
    el.innerHTML = lista.map(l => `
      <div class="item">
        <div class="esquerda">
          <div class="capa-mini">🏪</div>
          <div><div class="nome">${l.nome}</div><div class="detalhe">${l.descricao || 'sem descrição'}</div></div>
        </div>
        <div class="botoes"><button class="btn-acao btn-excluir" onclick="excluirLoja('${l.id}')">Excluir</button></div>
      </div>
    `).join('');
  }

  async function criarLoja() {
    const nome = document.getElementById('lojaNome').value.trim();
    const desc = document.getElementById('lojaDesc').value.trim();
    const catId = document.getElementById('lojaCat').value;
    if (!nome) { toast('Digite o nome da loja.', true); return; }
    const slug = nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const res = await fetch(SUPABASE_URL + '/rest/v1/lojas', { method: 'POST', headers, body: JSON.stringify({ nome, slug, descricao: desc, ativo: true }) });
    const loja = (await res.json())[0];
    await fetch(SUPABASE_URL + '/rest/v1/loja_categorias', { method: 'POST', headers, body: JSON.stringify({ loja_id: loja.id, categoria_id: catId }) });
    toast('Loja criada! ✅');
    carregarLojas();
    document.getElementById('lojaNome').value = '';
    document.getElementById('lojaDesc').value = '';
  }

  async function excluirLoja(id) {
    if (!confirm('Excluir essa loja?')) return;
    await fetch(SUPABASE_URL + '/rest/v1/lojas?id=eq.' + id, { method: 'DELETE', headers });
    carregarLojas();
  }

  // ==== PRODUTOS (com upload) ====
  let capa_url_global = '';
  let arquivo_url_global = '';
  let previas_urls_global = [];

  async function renderProdutos() {
    const c = document.getElementById('conteudo');
    const [lojas, cats] = await Promise.all([
      fetch(SUPABASE_URL + '/rest/v1/lojas?select=*', { headers }).then(r => r.json()),
      fetch(SUPABASE_URL + '/rest/v1/categorias?select=*', { headers }).then(r => r.json())
    ]);

    capa_url_global = '';
    arquivo_url_global = '';
    previas_urls_global = [];

    c.innerHTML = `
      <h2>Produtos</h2>
      <p class="sub">E-books, videoaulas, links e sistemas</p>

      <div class="formulario">
        <h3>Novo produto</h3>

        <div class="linha-form">
          <div><label>Título</label><input id="pTitle" placeholder="Ex: Bolo de Chocolate Cremoso"></div>
          <div><label>Preço (R$)</label><input id="pPreco" type="number" step="0.01" placeholder="29.90"></div>
          <div><label>Tipo</label>
            <select id="pTipo">
              <option value="pdf">📄 E-book PDF</option>
              <option value="video">🎬 Videoaula</option>
              <option value="link">🔗 Acesso a link</option>
              <option value="sistema">⚙️ Sistema</option>
            </select>
          </div>
        </div>

        <div class="linha-form">
          <div><label>Loja</label><select id="pLoja">${lojas.map(l => `<option value="${l.id}">${l.nome}</option>`).join('')}</select></div>
          <div><label>Categoria</label><select id="pCat">${cats.map(c => `<option value="${c.id}">${c.emoji || ''} ${c.nome}</option>`).join('')}</select></div>
        </div>

        <div class="linha-form">
          <div style="grid-column: 1 / -1;"><label>Descrição curta (aparece no card)</label><input id="pDescCurta" placeholder="Uma frase curta"></div>
        </div>

        <div class="linha-form">
          <div style="grid-column: 1 / -1;"><label>Descrição completa (opcional)</label><textarea id="pDescLonga" placeholder="Texto que aparece em 'Sobre este material'"></textarea></div>
        </div>

        <!-- CAPA -->
        <div class="linha-form">
          <div style="grid-column: 1 / -1;">
            <label>🖼️ Capa do produto</label>
            <div class="upload-box" id="boxCapa" onclick="document.getElementById('fileCapa').click()">
              <input type="file" id="fileCapa" accept="image/*" onchange="subirCapa(this.files[0])">
              <div class="icone">📤</div>
              <div class="txt">Clique ou arraste a imagem aqui</div>
              <div class="sub-txt">JPG, PNG ou WEBP</div>
              <div class="barra" id="barraCapa"><div></div></div>
            </div>
            <div class="campo-url">
              <small>Ou cole uma URL direta da capa (opcional):</small>
              <input id="pCapaUrl" placeholder="https://..." oninput="capa_url_global = this.value">
            </div>
          </div>
        </div>

        <!-- ARQUIVO PRINCIPAL -->
        <div class="linha-form">
          <div style="grid-column: 1 / -1;">
            <label>📄 Arquivo principal (PDF ou vídeo)</label>
            <div class="upload-box" id="boxArquivo" onclick="document.getElementById('fileArquivo').click()">
              <input type="file" id="fileArquivo" accept=".pdf,video/*" onchange="subirArquivo(this.files[0])">
              <div class="icone">📎</div>
              <div class="txt">Clique ou arraste o PDF/vídeo aqui</div>
              <div class="sub-txt">PDF, MP4, etc (até 50 MB)</div>
              <div class="barra" id="barraArquivo"><div></div></div>
            </div>
            <div class="campo-url">
              <small>Ou cole uma URL de link externo (para vender sistemas como RG Pet):</small>
              <input id="pArquivoUrl" placeholder="https://..." oninput="arquivo_url_global = this.value">
            </div>
          </div>
        </div>

        <!-- PRÉVIAS -->
        <div class="linha-form">
          <div style="grid-column: 1 / -1;">
            <label>🖼️ Imagens de prévia (aparecem em "Por dentro do material")</label>
            <div class="upload-box" id="boxPrevia" onclick="document.getElementById('filePrevia').click()">
              <input type="file" id="filePrevia" accept="image/*" multiple onchange="subirPrevias(this.files)">
              <div class="icone">🖼️</div>
              <div class="txt">Clique ou arraste 1 ou 2 imagens aqui</div>
              <div class="sub-txt">Aparecem para a cliente antes de comprar</div>
              <div class="barra" id="barraPrevia"><div></div></div>
            </div>
            <div class="campo-url">
              <small>Ou cole URLs separadas por vírgula (opcional):</small>
              <input id="pPreviaUrl" placeholder="https://..., https://..." oninput="previas_urls_global = this.value.split(',').map(s=>s.trim()).filter(Boolean)">
            </div>
          </div>
        </div>

        <button class="btn-primario" id="btnCriarProd" onclick="criarProduto()">Criar produto</button>
      </div>

      <div class="lista" id="listaProds"></div>
    `;

    // Ativar drag-and-drop nas 3 caixas
    ativarDrag('boxCapa', 'fileCapa', (f) => subirCapa(f));
    ativarDrag('boxArquivo', 'fileArquivo', (f) => subirArquivo(f));
    ativarDrag('boxPrevia', 'filePrevia', (f) => subirPrevias([f]));

    carregarProds();
  }

  function ativarDrag(boxId, inputId, callback) {
    const box = document.getElementById(boxId);
    ['dragenter','dragover'].forEach(ev => box.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation(); box.classList.add('arrastando');
    }));
    ['dragleave','drop'].forEach(ev => box.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation(); box.classList.remove('arrastando');
    }));
    box.addEventListener('drop', e => {
      const files = e.dataTransfer.files;
      if (files.length > 0) callback(files[0]);
    });
  }

  async function subirCapa(file) {
    if (!file) return;
    const box = document.getElementById('boxCapa');
    box.innerHTML = '<div class="icone">⏳</div><div class="txt">Enviando...</div>';
    try {
      const url = await uploadArquivo(file, 'capas');
      capa_url_global = url;
      box.innerHTML = `
        <button class="remover" onclick="event.stopPropagation();removerCapa()">Remover</button>
        <img class="preview" src="${url}" alt="Capa">
        <div class="sub-txt" style="margin-top:6px;">✅ Capa enviada</div>
      `;
      document.getElementById('pCapaUrl').value = '';
      toast('Capa enviada! ✅');
    } catch (e) {
      box.innerHTML = '<div class="icone">❌</div><div class="txt">Erro no upload</div><div class="sub-txt">' + e.message + '</div>';
      toast('Erro ao enviar capa.', true);
    }
  }

  function removerCapa() {
    capa_url_global = '';
    const box = document.getElementById('boxCapa');
    box.innerHTML = `
      <input type="file" id="fileCapa" accept="image/*" onchange="subirCapa(this.files[0])">
      <div class="icone">📤</div>
      <div class="txt">Clique ou arraste a imagem aqui</div>
      <div class="sub-txt">JPG, PNG ou WEBP</div>
      <div class="barra" id="barraCapa"><div></div></div>
    `;
    ativarDrag('boxCapa', 'fileCapa', (f) => subirCapa(f));
  }

  async function subirArquivo(file) {
    if (!file) return;
    const box = document.getElementById('boxArquivo');
    box.innerHTML = '<div class="icone">⏳</div><div class="txt">Enviando...</div>';
    try {
      const url = await uploadArquivo(file, 'produtos');
      arquivo_url_global = url;
      box.innerHTML = `
        <button class="remover" onclick="event.stopPropagation();removerArquivo()">Remover</button>
        <div class="icone">✅</div>
        <div class="txt">${file.name}</div>
        <div class="sub-txt">${(file.size/1024/1024).toFixed(1)} MB • enviado</div>
      `;
      document.getElementById('pArquivoUrl').value = '';
      toast('Arquivo enviado! ✅');
    } catch (e) {
      box.innerHTML = '<div class="icone">❌</div><div class="txt">Erro no upload</div><div class="sub-txt">' + e.message + '</div>';
      toast('Erro ao enviar arquivo.', true);
    }
  }

  function removerArquivo() {
    arquivo_url_global = '';
    const box = document.getElementById('boxArquivo');
    box.innerHTML = `
      <input type="file" id="fileArquivo" accept=".pdf,video/*" onchange="subirArquivo(this.files[0])">
      <div class="icone">📎</div>
      <div class="txt">Clique ou arraste o PDF/vídeo aqui</div>
      <div class="sub-txt">PDF, MP4, etc (até 50 MB)</div>
      <div class="barra" id="barraArquivo"><div></div></div>
    `;
    ativarDrag('boxArquivo', 'fileArquivo', (f) => subirArquivo(f));
  }

  async function subirPrevias(files) {
    if (!files || !files.length) return;
    const box = document.getElementById('boxPrevia');
    box.innerHTML = '<div class="icone">⏳</div><div class="txt">Enviando ' + files.length + ' imagem(ns)...</div>';
    try {
      const urls = [];
      for (const f of files) {
        const u = await uploadArquivo(f, 'capas');
        urls.push(u);
      }
      previas_urls_global = urls;
      box.innerHTML = `
        <button class="remover" onclick="event.stopPropagation();removerPrevias()">Remover</button>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
          ${urls.map(u => `<img class="preview" src="${u}" style="max-height:80px;margin:0;">`).join('')}
        </div>
        <div class="sub-txt" style="margin-top:6px;">✅ ${urls.length} imagem(ns) enviada(s)</div>
      `;
      document.getElementById('pPreviaUrl').value = '';
      toast('Prévias enviadas! ✅');
    } catch (e) {
      box.innerHTML = '<div class="icone">❌</div><div class="txt">Erro no upload</div>';
      toast('Erro ao enviar prévias.', true);
    }
  }

  function removerPrevias() {
    previas_urls_global = [];
    const box = document.getElementById('boxPrevia');
    box.innerHTML = `
      <input type="file" id="filePrevia" accept="image/*" multiple onchange="subirPrevias(this.files)">
      <div class="icone">🖼️</div>
      <div class="txt">Clique ou arraste 1 ou 2 imagens aqui</div>
      <div class="sub-txt">Aparecem para a cliente antes de comprar</div>
      <div class="barra" id="barraPrevia"><div></div></div>
    `;
    ativarDrag('boxPrevia', 'filePrevia', (f) => subirPrevias([f]));
  }

  async function carregarProds() {
    const res = await fetch(SUPABASE_URL + '/rest/v1/produtos?select=*&order=created_at.desc', { headers });
    const lista = await res.json();
    const el = document.getElementById('listaProds');
    if (!lista.length) { el.innerHTML = '<div class="vazio-lista">Nenhum produto ainda.</div>'; return; }
    el.innerHTML = lista.map(p => {
      const preco = (p.preco_cents / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      return `
        <div class="item">
          <div class="esquerda">
            <div class="capa-mini">${p.capa_url ? `<img src="${p.capa_url}">` : '📖'}</div>
            <div><div class="nome">${p.titulo}</div><div class="detalhe">${p.tipo.toUpperCase()} • ${preco}</div></div>
          </div>
          <div class="botoes">
            <a class="btn-acao" href="produto.html?id=${p.id}" target="_blank">Ver</a>
            <button class="btn-acao btn-excluir" onclick="excluirProduto('${p.id}')">Excluir</button>
          </div>
        </div>
      `;
    }).join('');
  }

  async function criarProduto() {
    const titulo = document.getElementById('pTitle').value.trim();
    const preco = parseFloat(document.getElementById('pPreco').value) || 0;
    const tipo = document.getElementById('pTipo').value;
    const lojaId = document.getElementById('pLoja').value;
    const catId = document.getElementById('pCat').value;
    const descCurta = document.getElementById('pDescCurta').value.trim();
    const descLonga = document.getElementById('pDescLonga').value.trim();

    const capaFinal = capa_url_global || document.getElementById('pCapaUrl').value.trim();
    const arquivoFinal = arquivo_url_global || document.getElementById('pArquivoUrl').value.trim();
    const previaInput = document.getElementById('pPreviaUrl').value.trim();
    const previasFinal = previas_urls_global.length ? previas_urls_global.join(',') : previaInput;

    if (!titulo) { toast('Digite o título do produto.', true); return; }
    if (!lojaId) { toast('Cadastre uma loja primeiro.', true); return; }

    const btn = document.getElementById('btnCriarProd');
    btn.disabled = true;
    btn.textContent = 'Criando...';

    try {
      await fetch(SUPABASE_URL + '/rest/v1/produtos', {
        method: 'POST',
        headers,
        body: JSON.stringify({
          titulo,
          loja_id: lojaId,
          categoria_id: catId || null,
          preco_cents: Math.round(preco * 100),
          tipo,
          descricao_curta: descCurta,
          descricao_longa: descLonga,
          capa_url: capaFinal || null,
          arquivo_url: arquivoFinal || null,
          preview_urls: previasFinal || null,
          ativo: true
        })
      });
      toast('Produto criado! ✅');
      renderProdutos();
    } catch (e) {
      toast('Erro ao criar produto.', true);
      btn.disabled = false;
      btn.textContent = 'Criar produto';
    }
  }

  async function excluirProduto(id) {
    if (!confirm('Excluir esse produto?')) return;
    await fetch(SUPABASE_URL + '/rest/v1/produtos?id=eq.' + id, { method: 'DELETE', headers });
    carregarProds();
  }

  // ==== CLIENTES ====
  async function renderClientes() {
    const c = document.getElementById('conteudo');
    c.innerHTML = '<h2>Clientes</h2><p class="sub">Quem se cadastrou no site</p><p>Carregando...</p>';
    carregarClientes();
  }

  async function carregarClientes() {
    const res = await fetch(SUPABASE_URL + '/rest/v1/clientes?select=*&order=created_at.desc', { headers });
    const lista = await res.json();
    const el = document.getElementById('conteudo');
    if (!lista.length) {
      el.innerHTML = '<h2>Clientes</h2><p class="sub">Quem se cadastrou no site</p><div class="vazio-lista">Nenhum cliente ainda.</div>';
      return;
    }
    el.innerHTML = `
      <h2>Clientes</h2>
      <p class="sub">Quem se cadastrou no site (${lista.length})</p>
      <div class="lista">
        ${lista.map(cl => {
          const zap = normalizarWhatsApp(cl.whatsapp);
          const linkZap = zap ? `https://wa.me/${zap}` : '#';
          return `
            <div class="item">
              <div class="esquerda">
                <div class="capa-mini">👤</div>
                <div>
                  <div class="nome">${cl.nome || 'Sem nome'}</div>
                  <div class="detalhe">📧 ${cl.email || '-'} • 📱 ${cl.whatsapp || 'sem whatsapp'}</div>
                </div>
              </div>
              <div class="botoes">
                ${zap ? `<a class="btn-acao btn-zap" href="${linkZap}" target="_blank">💬 WhatsApp</a>` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }
</script>
