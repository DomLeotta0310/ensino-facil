<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel ADM - Ensino Fácil</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    background: #F7F3EE;
    color: #3D2314;
    min-height: 100vh;
  }

  /* ==== LOGIN ==== */
  #login {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(180deg, #FAF3E8 0%, #F0E2CC 100%);
  }
  .login-card {
    background: #FAF3E8;
    border: 1px solid #E4D2B7;
    border-radius: 20px;
    padding: 40px 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 8px 24px -8px rgba(61,35,20,0.25);
    text-align: center;
  }
  .login-card h1 {
    font-family: 'Georgia', serif;
    font-size: 26px;
    margin-bottom: 6px;
  }
  .login-card p {
    font-size: 13px;
    color: #8B5E3C;
    margin-bottom: 24px;
  }
  .login-card input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #E4D2B7;
    border-radius: 12px;
    font-size: 15px;
    margin-bottom: 14px;
    outline: none;
  }
  .login-card input:focus { border-color: #C9A961; }
  .login-card button {
    width: 100%;
    padding: 14px;
    background: #6B4423;
    color: #FAF3E8;
    border: none;
    border-radius: 999px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    font-family: 'Georgia', serif;
  }
  .login-card .erro {
    color: #C62828;
    font-size: 13px;
    margin-top: 10px;
    display: none;
  }

  /* ==== PAINEL ==== */
  #painel { display: none; }

  .topo {
    background: #1F2A2E;
    color: #FAF3E8;
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .topo .logo {
    font-family: 'Georgia', serif;
    font-size: 20px;
    font-weight: bold;
  }
  .topo .logo span { color: #C9A961; }
  .topo button {
    background: transparent;
    border: 1px solid #FAF3E8;
    color: #FAF3E8;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
  }
  .topo button:hover { background: #FAF3E8; color: #1F2A2E; }

  .layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: calc(100vh - 56px);
  }

  .menu-lateral {
    background: #2B3A3F;
    padding: 20px 0;
  }
  .menu-lateral a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 22px;
    color: #C9C9C9;
    text-decoration: none;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    border-left: 3px solid transparent;
  }
  .menu-lateral a:hover { background: rgba(255,255,255,0.05); color: #fff; }
  .menu-lateral a.ativo {
    background: rgba(201,169,97,0.15);
    color: #C9A961;
    border-left-color: #C9A961;
    font-weight: bold;
  }

  .conteudo { padding: 30px; }
  .conteudo h2 {
    font-family: 'Georgia', serif;
    font-size: 26px;
    margin-bottom: 4px;
  }
  .conteudo .sub {
    color: #8B5E3C;
    font-size: 14px;
    margin-bottom: 24px;
  }

  /* Cartões de estatística */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 30px;
  }
  .card-stat {
    background: #FFFFFF;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 2px 8px -2px rgba(61,35,20,0.12);
    border-left: 4px solid #C9A961;
  }
  .card-stat .label {
    font-size: 12px;
    color: #8B5E3C;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .card-stat .valor {
    font-size: 26px;
    font-weight: bold;
    color: #3D2314;
  }

  /* Formulário */
  .formulario {
    background: #FFFFFF;
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 2px 8px -2px rgba(61,35,20,0.12);
    margin-bottom: 24px;
  }
  .formulario h3 {
    font-family: 'Georgia', serif;
    font-size: 18px;
    margin-bottom: 16px;
  }
  .linha-form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 12px;
  }
  .formulario label {
    display: block;
    font-size: 12px;
    color: #8B5E3C;
    font-weight: bold;
    margin-bottom: 4px;
  }
  .formulario input, .formulario select, .formulario textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #E4D2B7;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    font-family: Arial, sans-serif;
  }
  .formulario textarea { resize: vertical; min-height: 70px; }
  .formulario input:focus, .formulario select:focus, .formulario textarea:focus {
    border-color: #C9A961;
  }
  .btn-primario {
    background: #6B4423;
    color: #FAF3E8;
    border: none;
    padding: 12px 28px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    font-family: 'Georgia', serif;
  }
  .btn-primario:hover { background: #3D2314; }

  /* Lista */
  .lista { display: grid; gap: 12px; }
  .item {
    background: #FFFFFF;
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 2px 8px -2px rgba(61,35,20,0.10);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .item .esquerda { display: flex; align-items: center; gap: 14px; }
  .item .capa-mini {
    width: 50px;
    height: 65px;
    background: #E4D2B7;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .item .capa-mini img { width: 100%; height: 100%; object-fit: cover; }
  .item .nome { font-weight: bold; font-size: 15px; }
  .item .detalhe { font-size: 12px; color: #8B5E3C; margin-top: 3px; }
  .item .botoes { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-acao {
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    border: 1px solid #E4D2B7;
    background: #FAF3E8;
    color: #6B4423;
    text-decoration: none;
    font-family: Arial, sans-serif;
  }
  .btn-acao:hover { background: #F0E2CC; }
  .btn-zap {
    background: #25D366;
    color: #FFF;
    border: none;
    font-weight: bold;
  }
  .btn-zap:hover { background: #1DA851; }
  .btn-excluir {
    background: #FFEBEE;
    color: #C62828;
    border: 1px solid #EF9A9A;
  }
  .btn-excluir:hover { background: #FFCDD2; }

  .vazio-lista {
    text-align: center;
    padding: 40px;
    color: #8B5E3C;
    background: #FFFFFF;
    border-radius: 12px;
    font-size: 14px;
    border: 2px dashed #E4D2B7;
  }

  /* Abas internas */
  .abas {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .aba {
    padding: 8px 18px;
    border-radius: 999px;
    background: #FFFFFF;
    color: #6B4423;
    border: 1px solid #E4D2B7;
    cursor: pointer;
    font-size: 13px;
  }
  .aba.ativa {
    background: #6B4423;
    color: #FAF3E8;
    border-color: #6B4423;
    font-weight: bold;
  }

  .aviso {
    padding: 12px 16px;
    background: #FFF8E1;
    border: 1px solid #FFE082;
    color: #7A5C00;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<!-- ==== TELA DE LOGIN ==== -->
<div id="login">
  <div class="login-card">
    <h1>🔐 Painel ADM</h1>
    <p>Ensino Fácil — Área restrita</p>
    <input type="password" id="senhaInput" placeholder="Digite a senha" onkeydown="if(event.key==='Enter')entrar()">
    <button onclick="entrar()">Entrar</button>
    <p class="erro" id="erroLogin">Senha incorreta.</p>
  </div>
</div>

<!-- ==== PAINEL ==== -->
<div id="painel">
  <div class="topo">
    <div class="logo">📖 Ensino <span>Fácil</span> — ADM</div>
    <button onclick="sair()">Sair</button>
  </div>

  <div class="layout">
    <nav class="menu-lateral">
      <a data-secao="dashboard" class="ativo">📊 Painel</a>
      <a data-secao="categorias">📁 Categorias</a>
      <a data-secao="lojas">🏪 Lojas</a>
      <a data-secao="produtos">📦 Produtos</a>
      <a data-secao="clientes">👥 Clientes</a>
    </nav>

    <main class="conteudo" id="conteudo"></main>
  </div>
</div>

<script>
  const SENHA = "Neriane147852@";
  const SUPABASE_URL = "https://lfepiujvufjbufzblnke.supabase.co";
  const SUPABASE_KEY = "sb_publishable_gtzU89_Ygs146r-beP3nHA_nIEdFK8j";

  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };

  let secaoAtual = 'dashboard';

  // ==== LOGIN ====
  function entrar() {
    const senha = document.getElementById('senhaInput').value;
    if (senha === SENHA) {
      localStorage.setItem('ef_admin', 'ok');
      abrirPainel();
    } else {
      document.getElementById('erroLogin').style.display = 'block';
    }
  }

  function sair() {
    localStorage.removeItem('ef_admin');
    location.reload();
  }

  function abrirPainel() {
    document.getElementById('login').style.display = 'none';
    document.getElementById('painel').style.display = 'block';
    navegar('dashboard');
  }

  // Se já logou antes, entra direto
  if (localStorage.getItem('ef_admin') === 'ok') {
    abrirPainel();
  }

  // ==== NAVEGAÇÃO ====
  document.querySelectorAll('.menu-lateral a').forEach(link => {
    link.addEventListener('click', () => {
      navegar(link.dataset.secao);
    });
  });

  function navegar(secao) {
    secaoAtual = secao;
    document.querySelectorAll('.menu-lateral a').forEach(a => a.classList.remove('ativo'));
    document.querySelector(`[data-secao="${secao}"]`).classList.add('ativo');

    if (secao === 'dashboard') renderDashboard();
    if (secao === 'categorias') renderCategorias();
    if (secao === 'lojas') renderLojas();
    if (secao === 'produtos') renderProdutos();
    if (secao === 'clientes') renderClientes();
  }

  // ==== DASHBOARD ====
  async function renderDashboard() {
    const c = document.getElementById('conteudo');
    c.innerHTML = '<h2>Painel</h2><p class="sub">Visão geral do Ensino Fácil</p><p>Carregando...</p>';

    try {
      const [cats, lojas, prods, clientes, vendas] = await Promise.all([
        fetch(SUPABASE_URL + '/rest/v1/categorias?select=id', { headers }).then(r => r.json()),
        fetch(SUPABASE_URL + '/rest/v1/lojas?select=id', { headers }).then(r => r.json()),
        fetch(SUPABASE_URL + '/rest/v1/produtos?select=id,titulo,tipo', { headers }).then(r => r.json()),
        fetch(SUPABASE_URL + '/rest/v1/clientes?select=id', { headers }).then(r => r.json()),
        fetch(SUPABASE_URL + '/rest/v1/compras?select=id', { headers }).then(r => r.json())
      ]);

      c.innerHTML = `
        <h2>Painel</h2>
        <p class="sub">Visão geral do Ensino Fácil</p>
        <div class="cards">
          <div class="card-stat"><div class="label">Categorias</div><div class="valor">${cats.length}</div></div>
          <div class="card-stat"><div class="label">Lojas</div><div class="valor">${lojas.length}</div></div>
          <div class="card-stat"><div class="label">Produtos</div><div class="valor">${prods.length}</div></div>
          <div class="card-stat"><div class="label">Clientes</div><div class="valor">${clientes.length}</div></div>
          <div class="card-stat"><div class="label">Vendas</div><div class="valor">${vendas.length}</div></div>
        </div>
        <div class="aviso">
          💡 <b>Em breve:</b> aqui vai aparecer também o ranking de produtos mais vendidos e o faturamento total (quando o Mercado Pago estiver ligado).
        </div>
      `;
    } catch (e) {
      c.innerHTML = '<p>Erro ao carregar.</p>';
    }
  }

  // ==== CATEGORIAS ====
  async function renderCategorias() {
    const c = document.getElementById('conteudo');
    c.innerHTML = `
      <h2>Categorias</h2>
      <p class="sub">As prateleiras principais do site (Confeitaria, Pet, Moda...)</p>

      <div class="formulario">
        <h3>Nova categoria</h3>
        <div class="linha-form">
          <div><label>Nome</label><input id="catNome" placeholder="Ex: Confeitaria"></div>
          <div><label>Emoji</label><input id="catEmoji" placeholder="Ex: 🧁" maxlength="4"></div>
          <div><label>Ordem</label><input id="catOrdem" type="number" value="1"></div>
        </div>
        <button class="btn-primario" onclick="criarCategoria()">Criar categoria</button>
      </div>

      <div class="lista" id="listaCats"></div>
    `;
    carregarCats();
  }

  async function carregarCats() {
    const res = await fetch(SUPABASE_URL + '/rest/v1/categorias?select=*&order=ordem.asc', { headers });
    const lista = await res.json();
    const el = document.getElementById('listaCats');

    if (!lista.length) {
      el.innerHTML = '<div class="vazio-lista">Nenhuma categoria ainda. Crie a primeira acima.</div>';
      return;
    }

    el.innerHTML = lista.map(cat => `
      <div class="item">
        <div class="esquerda">
          <div class="capa-mini">${cat.emoji || '📚'}</div>
          <div>
            <div class="nome">${cat.nome}</div>
            <div class="detalhe">slug: ${cat.slug} • ordem: ${cat.ordem}</div>
          </div>
        </div>
        <div class="botoes">
          <button class="btn-acao btn-excluir" onclick="excluirCategoria('${cat.id}')">Excluir</button>
        </div>
      </div>
    `).join('');
  }

  async function criarCategoria() {
    const nome = document.getElementById('catNome').value.trim();
    const emoji = document.getElementById('catEmoji').value.trim() || '📚';
    const ordem = parseInt(document.getElementById('catOrdem').value) || 0;

    if (!nome) { alert('Digite o nome da categoria.'); return; }

    const slug = nome.toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

    await fetch(SUPABASE_URL + '/rest/v1/categorias', {
      method: 'POST',
      headers,
      body: JSON.stringify({ nome, slug, emoji, ordem, ativo: true })
    });

    alert('Categoria criada! ✅');
    carregarCats();
    document.getElementById('catNome').value = '';
    document.getElementById('catEmoji').value = '';
  }

  async function excluirCategoria(id) {
    if (!confirm('Excluir essa categoria?')) return;
    await fetch(SUPABASE_URL + '/rest/v1/categorias?id=eq.' + id, { method: 'DELETE', headers });
    carregarCats();
  }

  // ==== LOJAS ====
  async function renderLojas() {
    const c = document.getElementById('conteudo');
    const cats = await fetch(SUPABASE_URL + '/rest/v1/categorias?select=*', { headers }).then(r => r.json());

    c.innerHTML = `
      <h2>Lojas</h2>
      <p class="sub">Os vendedores (Bolos e Doces da Nê, Bolo da Vovó...)</p>

      <div class="formulario">
        <h3>Nova loja</h3>
        <div class="linha-form">
          <div><label>Nome da loja</label><input id="lojaNome" placeholder="Ex: Bolos e Doces da Nê"></div>
          <div><label>Descrição</label><input id="lojaDesc" placeholder="Ex: Receitas exclusivas"></div>
          <div><label>Categoria</label>
            <select id="lojaCat">
              ${cats.map(c => `<option value="${c.id}">${c.emoji || ''} ${c.nome}</option>`).join('')}
            </select>
          </div>
        </div>
        <button class="btn-primario" onclick="criarLoja()">Criar loja</button>
      </div>

      <div class="lista" id="listaLojas"></div>
    `;
    carregarLojas();
  }

  async function carregarLojas() {
    const res = await fetch(SUPABASE_URL + '/rest/v1/lojas?select=*', { headers });
    const lista = await res.json();
    const el = document.getElementById('listaLojas');

    if (!lista.length) {
      el.innerHTML = '<div class="vazio-lista">Nenhuma loja ainda.</div>';
      return;
    }

    el.innerHTML = lista.map(l => `
      <div class="item">
        <div class="esquerda">
          <div class="capa-mini">🏪</div>
          <div>
            <div class="nome">${l.nome}</div>
            <div class="detalhe">${l.descricao || 'sem descrição'}</div>
          </div>
        </div>
        <div class="botoes">
          <button class="btn-acao btn-excluir" onclick="excluirLoja('${l.id}')">Excluir</button>
        </div>
      </div>
    `).join('');
  }

  async function criarLoja() {
    const nome = document.getElementById('lojaNome').value.trim();
    const desc = document.getElementById('lojaDesc').value.trim();
    const catId = document.getElementById('lojaCat').value;

    if (!nome) { alert('Digite o nome da loja.'); return; }

    const slug = nome.toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

    const res = await fetch(SUPABASE_URL + '/rest/v1/lojas', {
      method: 'POST',
      headers,
      body: JSON.stringify({ nome, slug, descricao: desc, ativo: true })
    });
    const loja = (await res.json())[0];

    await fetch(SUPABASE_URL + '/rest/v1/loja_categorias', {
      method: 'POST',
      headers,
      body: JSON.stringify({ loja_id: loja.id, categoria_id: catId })
    });

    alert('Loja criada! ✅');
    carregarLojas();
    document.getElementById('lojaNome').value = '';
    document.getElementById('lojaDesc').value = '';
  }

  async function excluirLoja(id) {
    if (!confirm('Excluir essa loja?')) return;
    await fetch(SUPABASE_URL + '/rest/v1/lojas?id=eq.' + id, { method: 'DELETE', headers });
    carregarLojas();
  }

  // ==== PRODUTOS ====
  async function renderProdutos() {
    const c = document.getElementById('conteudo');
    const [lojas, cats] = await Promise.all([
      fetch(SUPABASE_URL + '/rest/v1/lojas?select=*', { headers }).then(r => r.json()),
      fetch(SUPABASE_URL + '/rest/v1/categorias?select=*', { headers }).then(r => r.json())
    ]);

    c.innerHTML = `
      <h2>Produtos</h2>
      <p class="sub">E-books, videoaulas, links e sistemas</p>

      <div class="formulario">
        <h3>Novo produto</h3>
        <div class="linha-form">
          <div><label>Título</label><input id="pTitle" placeholder="Ex: Bolo de Chocolate Cremoso"></div>
          <div><label>Preço (R$)</label><input id="pPreco" type="number" step="0.01" placeholder="29.90"></div>
          <div><label>Tipo</label>
            <select id="pTipo">
              <option value="pdf">📄 E-book PDF</option>
              <option value="video">🎬 Videoaula</option>
              <option value="link">🔗 Acesso a link</option>
              <option value="sistema">⚙️ Sistema</option>
            </select>
          </div>
        </div>
        <div class="linha-form">
          <div><label>Loja</label>
            <select id="pLoja">${lojas.map(l => `<option value="${l.id}">${l.nome}</option>`).join('')}</select>
          </div>
          <div><label>Categoria</label>
            <select id="pCat">${cats.map(c => `<option value="${c.id}">${c.emoji || ''} ${c.nome}</option>`).join('')}</select>
          </div>
        </div>
        <div class="linha-form">
          <div style="grid-column: 1 / -1;"><label>Descrição curta</label><input id="pDescCurta" placeholder="Uma frase que aparece no card"></div>
        </div>
        <div class="linha-form">
          <div style="grid-column: 1 / -1;"><label>Descrição completa (opcional)</label><textarea id="pDescLonga" placeholder="Texto que aparece em 'Sobre este material'"></textarea></div>
        </div>
        <div class="linha-form">
          <div style="grid-column: 1 / -1;">
            <label>URL da capa (link do Supabase Storage)</label>
            <input id="pCapa" placeholder="https://.../capas/nomedaimagem.jpg">
          </div>
        </div>
        <div class="linha-form">
          <div style="grid-column: 1 / -1;">
            <label>URL do arquivo principal (PDF/vídeo/link)</label>
            <input id="pArquivo" placeholder="https://...">
          </div>
        </div>
        <div class="linha-form">
          <div style="grid-column: 1 / -1;">
            <label>URLs das imagens de prévia (separadas por vírgula)</label>
            <input id="pPrevia" placeholder="https://..., https://...">
          </div>
        </div>
        <button class="btn-primario" onclick="criarProduto()">Criar produto</button>
      </div>

      <div class="lista" id="listaProds"></div>
    `;
    carregarProds();
  }

  async function carregarProds() {
    const res = await fetch(SUPABASE_URL + '/rest/v1/produtos?select=*&order=created_at.desc', { headers });
    const lista = await res.json();
    const el = document.getElementById('listaProds');

    if (!lista.length) {
      el.innerHTML = '<div class="vazio-lista">Nenhum produto ainda.</div>';
      return;
    }

    el.innerHTML = lista.map(p => {
      const preco = (p.preco_cents / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      return `
        <div class="item">
          <div class="esquerda">
            <div class="capa-mini">
              ${p.capa_url ? `<img src="${p.capa_url}">` : '📖'}
            </div>
            <div>
              <div class="nome">${p.titulo}</div>
              <div class="detalhe">${p.tipo.toUpperCase()} • ${preco}</div>
            </div>
          </div>
          <div class="botoes">
            <a class="btn-acao" href="produto.html?id=${p.id}" target="_blank">Ver</a>
            <button class="btn-acao btn-excluir" onclick="excluirProduto('${p.id}')">Excluir</button>
          </div>
        </div>
      `;
    }).join('');
  }

  async function criarProduto() {
    const titulo = document.getElementById('pTitle').value.trim();
    const preco = parseFloat(document.getElementById('pPreco').value) || 0;
    const tipo = document.getElementById('pTipo').value;
    const lojaId = document.getElementById('pLoja').value;
    const catId = document.getElementById('pCat').value;
    const descCurta = document.getElementById('pDescCurta').value.trim();
    const descLonga = document.getElementById('pDescLonga').value.trim();
    const capa = document.getElementById('pCapa').value.trim();
    const arquivo = document.getElementById('pArquivo').value.trim();
    const previa = document.getElementById('pPrevia').value.trim();

    if (!titulo) { alert('Digite o título do produto.'); return; }
    if (!lojaId) { alert('Cadastre uma loja primeiro.'); return; }

    await fetch(SUPABASE_URL + '/rest/v1/produtos', {
      method: 'POST',
      headers,
      body: JSON.stringify({
        titulo,
        loja_id: lojaId,
        categoria_id: catId || null,
        preco_cents: Math.round(preco * 100),
        tipo,
        descricao_curta: descCurta,
        descricao_longa: descLonga,
        capa_url: capa || null,
        arquivo_url: arquivo || null,
        preview_urls: previa || null,
        ativo: true
      })
    });

    alert('Produto criado! ✅');
    carregarProds();
    ['pTitle','pPreco','pDescCurta','pDescLonga','pCapa','pArquivo','pPrevia'].forEach(id => {
      document.getElementById(id).value = '';
    });
  }

  async function excluirProduto(id) {
    if (!confirm('Excluir esse produto?')) return;
    await fetch(SUPABASE_URL + '/rest/v1/produtos?id=eq.' + id, { method: 'DELETE', headers });
    carregarProds();
  }

  // ==== CLIENTES ====
  async function renderClientes() {
    const c = document.getElementById('conteudo');
    c.innerHTML = '<h2>Clientes</h2><p class="sub">Quem se cadastrou no site</p><p>Carregando...</p>';
    carregarClientes();
  }

  async function carregarClientes() {
    const res = await fetch(SUPABASE_URL + '/rest/v1/clientes?select=*&order=created_at.desc', { headers });
    const lista = await res.json();
    const el = document.getElementById('conteudo');

    if (!lista.length) {
      el.innerHTML = '<h2>Clientes</h2><p class="sub">Quem se cadastrou no site</p><div class="vazio-lista">Nenhum cliente ainda.</div>';
      return;
    }

    el.innerHTML = `
      <h2>Clientes</h2>
      <p class="sub">Quem se cadastrou no site (${lista.length})</p>
      <div class="lista">
        ${lista.map(cl => {
          const zap = (cl.whatsapp || '').replace(/\D/g, '');
          const linkZap = zap ? `https://wa.me/55${zap}` : '#';
          return `
            <div class="item">
              <div class="esquerda">
                <div class="capa-mini">👤</div>
                <div>
                  <div class="nome">${cl.nome || 'Sem nome'}</div>
                  <div class="detalhe">📧 ${cl.email || '-'} • 📱 ${cl.whatsapp || 'sem whatsapp'}</div>
                </div>
              </div>
              <div class="botoes">
                ${zap ? `<a class="btn-acao btn-zap" href="${linkZap}" target="_blank">💬 WhatsApp</a>` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }
</script>
