<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produto - Ensino Fácil</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(180deg, #FAF3E8 0%, #F0E2CC 100%);
    color: #3D2314;
    min-height: 100vh;
  }
  header {
    background: rgba(250, 243, 232, 0.9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #E4D2B7;
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 40;
  }
  .logo {
    font-size: 22px;
    font-weight: bold;
    color: #3D2314;
    text-decoration: none;
  }
  .logo span { color: #8B5E3C; }
  main { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }
  .voltar {
    display: inline-block;
    margin-bottom: 24px;
    color: #8B5E3C;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 14px;
  }
  .voltar:hover { color: #3D2314; }
  .box {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 36px;
    align-items: start;
  }
  @media (max-width: 700px) {
    .box { grid-template-columns: 1fr; }
  }
  .capa-grande {
    aspect-ratio: 3/4;
    background: #E4D2B7;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #E4D2B7;
    box-shadow: 0 8px 20px -8px rgba(61,35,20,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
  }
  .capa-grande img { width: 100%; height: 100%; object-fit: cover; }
  .info h1 {
    font-size: 32px;
    color: #3D2314;
    margin-bottom: 8px;
    line-height: 1.2;
  }
  .preco-grande {
    font-size: 30px;
    color: #6B4423;
    font-weight: bold;
    margin: 16px 0 20px;
    font-family: Arial, sans-serif;
  }
  .descricao-curta {
    font-family: Arial, sans-serif;
    color: #3D2314;
    line-height: 1.7;
    font-size: 15px;
    margin-bottom: 24px;
  }
  .btn-comprar {
    display: block;
    width: 100%;
    padding: 18px;
    background: #6B4423;
    color: #FAF3E8;
    border: none;
    border-radius: 999px;
    font-size: 17px;
    font-weight: bold;
    font-family: 'Georgia', serif;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    text-decoration: none;
  }
  .btn-comprar:hover {
    background: #3D2314;
    transform: translateY(-2px);
    box-shadow: 0 8px 16px -6px rgba(61,35,20,0.5);
  }
  .aviso {
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #8B5E3C;
    text-align: center;
    margin-top: 14px;
  }
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: #8B5E3C;
    font-family: Arial, sans-serif;
  }
  .badge {
    display: inline-block;
    background: #C9A961;
    color: #FAF3E8;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    font-family: Arial, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }

  /* ==== SEÇÕES DE BAIXO ==== */
  .divisor {
    height: 1px;
    background: #E4D2B7;
    margin: 50px 0 40px;
  }
  .secao-titulo {
    font-size: 24px;
    color: #3D2314;
    margin-bottom: 6px;
  }
  .secao-sub {
    font-family: Arial, sans-serif;
    font-size: 14px;
    color: #8B5E3C;
    margin-bottom: 20px;
  }
  .previa-grid {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding-bottom: 14px;
  }
  .previa-grid::-webkit-scrollbar { height: 6px; }
  .previa-grid::-webkit-scrollbar-thumb { background: #C9A961; border-radius: 3px; }
  .previa-item {
    width: 200px;
    flex-shrink: 0;
    aspect-ratio: 3/4;
    background: #E4D2B7;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #E4D2B7;
    box-shadow: 0 4px 14px -4px rgba(61,35,20,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: #8B5E3C;
  }
  .previa-item img { width: 100%; height: 100%; object-fit: cover; }
  .sobre-texto {
    font-family: Arial, sans-serif;
    color: #3D2314;
    line-height: 1.8;
    font-size: 15px;
    white-space: pre-wrap;
    background: rgba(240, 226, 204, 0.5);
    padding: 24px;
    border-radius: 16px;
    border-left: 4px solid #C9A961;
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">📖 Ensino <span>Fácil</span></a>
</header>

<main>
  <a href="javascript:history.back()" class="voltar">← Voltar</a>
  <div id="conteudo">
    <p class="loading">Carregando...</p>
  </div>
</main>

<script>
  const SUPABASE_URL = "https://lfepiujvufjbufzblnke.supabase.co";
  const SUPABASE_KEY = "sb_publishable_gtzU89_Ygs146r-beP3nHA_nIEdFK8j";

  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY
  };

  function precoBR(cents) {
    return (cents / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function tipoLabel(t) {
    if (t === 'pdf') return 'E-book PDF';
    if (t === 'video') return 'Videoaula';
    if (t === 'link') return 'Acesso a link';
    if (t === 'sistema') return 'Sistema';
    return 'Produto';
  }

  async function carregar() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const conteudo = document.getElementById('conteudo');

    if (!id) {
      conteudo.innerHTML = '<p class="loading">Produto não encontrado.</p>';
      return;
    }

    try {
      const res = await fetch(
        SUPABASE_URL + '/rest/v1/produtos?select=*&id=eq.' + id,
        { headers }
      );
      const produtos = await res.json();

      if (!produtos || produtos.length === 0) {
        conteudo.innerHTML = '<p class="loading">Produto não encontrado.</p>';
        return;
      }

      const p = produtos[0];

      // Prepara as imagens de prévia (separadas por vírgula)
      const previews = (p.preview_urls || '')
        .split(',')
        .map(u => u.trim())
        .filter(u => u.length > 0);

      // Monta bloco de prévia (só aparece se tiver imagens)
      let blocoPrevia = '';
      if (previews.length > 0) {
        blocoPrevia = `
          <div class="divisor"></div>
          <h2 class="secao-titulo">📖 Por dentro do material</h2>
          <p class="secao-sub">Uma espiadinha no que você vai receber</p>
          <div class="previa-grid">
            ${previews.map(url => `
              <div class="previa-item">
                <img src="${url}" alt="Prévia">
              </div>
            `).join('')}
          </div>
        `;
      }

      // Bloco "sobre" (só aparece se tiver descrição longa)
      let blocoSobre = '';
      if (p.descricao_longa && p.descricao_longa.trim() !== '') {
        blocoSobre = `
          <div class="divisor"></div>
          <h2 class="secao-titulo">Sobre este material</h2>
          <p class="secao-sub">Tudo que você precisa saber</p>
          <div class="sobre-texto">${p.descricao_longa}</div>
        `;
      }

      conteudo.innerHTML = `
        <div class="box">
          <div class="capa-grande">
            ${p.capa_url ? `<img src="${p.capa_url}" alt="${p.titulo}">` : '📖'}
          </div>
          <div class="info">
            <div class="badge">${tipoLabel(p.tipo)}</div>
            <h1>${p.titulo}</h1>
            <p class="preco-grande">${precoBR(p.preco_cents)}</p>
            <div class="descricao-curta">${p.descricao_curta || ''}</div>
            <button class="btn-comprar" id="btn">Comprar agora</button>
            <p class="aviso">Após o pagamento, o produto fica disponível na sua estante pessoal.</p>
          </div>
        </div>

        ${blocoPrevia}
        ${blocoSobre}
      `;

      document.getElementById('btn').addEventListener('click', () => {
        alert('Próximo passo: criar o cadastro e integrar com o Mercado Pago!');
      });

    } catch (e) {
      conteudo.innerHTML = '<p class="loading">Erro ao carregar.</p>';
    }
  }

  carregar();
</script>

</body>
</html>
