<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produto - Ensino Fácil</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(180deg, #FAF3E8 0%, #F0E2CC 100%);
    color: #3D2314;
    min-height: 100vh;
  }
  header {
    background: rgba(250, 243, 232, 0.9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #E4D2B7;
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .logo {
    font-size: 22px;
    font-weight: bold;
    color: #3D2314;
    text-decoration: none;
  }
  .logo span { color: #8B5E3C; }
  .menu {
    display: flex;
    gap: 10px;
    align-items: center;
    font-family: Arial, sans-serif;
  }
  .menu a, .menu button {
    text-decoration: none;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    font-family: Arial, sans-serif;
  }
  .btn-estante { background: #C9A961; color: #FAF3E8; font-weight: bold; }
  .btn-estante:hover { background: #8B5E3C; }
  .btn-sair { background: transparent; border: 1px solid #8B5E3C !important; color: #8B5E3C; }
  .btn-sair:hover { background: #8B5E3C; color: #FAF3E8; }
  .btn-entrar { background: #6B4423; color: #FAF3E8; font-weight: bold; }
  .btn-entrar:hover { background: #3D2314; }
  main { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }
  .voltar {
    display: inline-block;
    margin-bottom: 24px;
    color: #8B5E3C;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 14px;
  }
  .voltar:hover { color: #3D2314; }
  .box {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 36px;
    align-items: start;
  }
  @media (max-width: 700px) {
    .box { grid-template-columns: 1fr; }
  }
  .capa-grande {
    aspect-ratio: 3/4;
    background: #E4D2B7;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #E4D2B7;
    box-shadow: 0 8px 20px -8px rgba(61,35,20,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
  }
  .capa-grande img { width: 100%; height: 100%; object-fit: cover; }
  .info h1 {
    font-size: 32px;
    color: #3D2314;
    margin-bottom: 8px;
    line-height: 1.2;
  }
  .preco-grande {
    font-size: 30px;
    color: #6B4423;
    font-weight: bold;
    margin: 16px 0 20px;
    font-family: Arial, sans-serif;
  }
  .descricao-curta {
    font-family: Arial, sans-serif;
    color: #3D2314;
    line-height: 1.7;
    font-size: 15px;
    margin-bottom: 24px;
  }
  .btn-comprar {
    display: block;
    width: 100%;
    padding: 18px;
    background: #6B4423;
    color: #FAF3E8;
    border: none;
    border-radius: 999px;
    font-size: 17px;
    font-weight: bold;
    font-family: 'Georgia', serif;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    text-decoration: none;
  }
  .btn-comprar:hover {
    background: #3D2314;
    transform: translateY(-2px);
    box-shadow: 0 8px 16px -6px rgba(61,35,20,0.5);
  }
  .aviso {
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #8B5E3C;
    text-align: center;
    margin-top: 14px;
  }
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: #8B5E3C;
    font-family: Arial, sans-serif;
  }
  .badge {
    display: inline-block;
    background: #C9A961;
    color: #FAF3E8;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    font-family: Arial, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  .divisor {
    height: 1px;
    background: #E4D2B7;
    margin: 50px 0 40px;
  }
  .secao-titulo {
    font-size: 24px;
    color: #3D2314;
    margin-bottom: 6px;
  }
  .secao-sub {
    font-family: Arial, sans-serif;
    font-size: 14px;
    color: #8B5E3C;
    margin-bottom: 20px;
  }
  .previa-grid {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding-bottom: 14px;
  }
  .previa-grid::-webkit-scrollbar { height: 6px; }
  .previa-grid::-webkit-scrollbar-thumb { background: #C9A961; border-radius: 3px; }
  .previa-item {
    width: 200px;
    flex-shrink: 0;
    aspect-ratio: 3/4;
    background: #E4D2B7;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #E4D2B7;
    box-shadow: 0 4px 14px -4px rgba(61,35,20,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: #8B5E3C;
    cursor: zoom-in;
    transition: transform 0.2s;
  }
  .previa-item:hover { transform: scale(1.03); }
  .previa-item img { width: 100%; height: 100%; object-fit: cover; }
  .sobre-texto {
    font-family: Arial, sans-serif;
    color: #3D2314;
    line-height: 1.8;
    font-size: 15px;
    white-space: pre-wrap;
    background: rgba(240, 226, 204, 0.5);
    padding: 24px;
    border-radius: 16px;
    border-left: 4px solid #C9A961;
  }

  /* ==== LIGHTBOX (imagem grandona) ==== */
  .lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(20, 10, 5, 0.92);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 20px;
    cursor: zoom-out;
    animation: fadeIn 0.2s ease;
  }
  .lightbox.aberto { display: flex; }
  .lightbox img {
    max-width: 95%;
    max-height: 95%;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    animation: zoomIn 0.25s ease;
  }
  .lightbox .fechar {
    position: absolute;
    top: 20px;
    right: 24px;
    background: rgba(255,255,255,0.15);
    border: none;
    color: #FAF3E8;
    font-size: 32px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    cursor: pointer;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    transition: background 0.2s;
  }
  .lightbox .fechar:hover { background: rgba(255,255,255,0.3); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes zoomIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">📖 Ensino <span>Fácil</span></a>
  <div class="menu" id="menu"></div>
</header>

<main>
  <a href="javascript:history.back()" class="voltar">← Voltar</a>
  <div id="conteudo">
    <p class="loading">Carregando...</p>
  </div>
</main>

<!-- Lightbox (imagem ampliada) -->
<div class="lightbox" id="lightbox" onclick="fecharLightbox(event)">
  <button class="fechar" onclick="fecharLightbox(event)">×</button>
  <img id="lightboxImg" src="" alt="Imagem ampliada">
</div>

<script>
  const SUPABASE_URL = "https://lfepiujvufjbufzblnke.supabase.co";
  const SUPABASE_KEY = "sb_publishable_gtzU89_Ygs146r-beP3nHA_nIEdFK8j";

  const token = localStorage.getItem('ef_token');
  const userRaw = localStorage.getItem('ef_user');
  const menu = document.getElementById('menu');

  if (token && userRaw) {
    const user = JSON.parse(userRaw);
    const nome = (user.user_metadata && user.user_metadata.nome) || 'você';
    menu.innerHTML = `
      <span style="color:#8B5E3C;font-size:13px;">Olá, ${nome.split(' ')[0]}!</span>
      <a href="minha-biblioteca.html" class="btn-estante">📚 Minha Estante</a>
      <button class="btn-sair" onclick="sair()">Sair</button>
    `;
  } else {
    menu.innerHTML = `<a href="entrar.html" class="btn-entrar">Entrar</a>`;
  }

  function sair() {
    localStorage.removeItem('ef_token');
    localStorage.removeItem('ef_user');
    window.location.href = 'index.html';
  }

  // ==== LIGHTBOX ====
  function abrirLightbox(url) {
    const lb = document.getElementById('lightbox');
    const img = document.getElementById('lightboxImg');
    img.src = url;
    lb.classList.add('aberto');
    document.body.style.overflow = 'hidden';
  }
  function fecharLightbox(e) {
    // Fecha se clicar no fundo ou no botão X (mas não se clicar na imagem em si)
    if (e.target.id === 'lightbox' || e.target.classList.contains('fechar')) {
      const lb = document.getElementById('lightbox');
      lb.classList.remove('aberto');
      document.body.style.overflow = '';
    }
  }
  // Fecha com a tecla ESC
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      document.getElementById('lightbox').classList.remove('aberto');
      document.body.style.overflow = '';
    }
  });

  // ==== FUNÇÕES ====
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY
  };

  function precoBR(cents) {
    return (cents / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function tipoLabel(t) {
    if (t === 'pdf') return 'E-book PDF';
    if (t === 'video') return 'Videoaula';
    if (t === 'link') return 'Acesso a link';
    if (t === 'sistema') return 'Sistema';
    return 'Produto';
  }

  async function carregar() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const conteudo = document.getElementById('conteudo');

    if (!id) {
      conteudo.innerHTML = '<p class="loading">Produto não encontrado.</p>';
      return;
    }

    try {
      const res = await fetch(
        SUPABASE_URL + '/rest/v1/produtos?select=*&id=eq.' + id,
        { headers }
      );
      const produtos = await res.json();

      if (!produtos || produtos.length === 0) {
        conteudo.innerHTML = '<p class="loading">Produto não encontrado.</p>';
        return;
      }

      const p = produtos[0];

      const previews = (p.preview_urls || '')
        .split(',')
        .map(u => u.trim())
        .filter(u => u.length > 0);

      let blocoPrevia = '';
      if (previews.length > 0) {
        blocoPrevia = `
          <div class="divisor"></div>
          <h2 class="secao-titulo">📖 Por dentro do material</h2>
          <p class="secao-sub">Toque na imagem para ampliar</p>
          <div class="previa-grid">
            ${previews.map(url => `
              <div class="previa-item" onclick="abrirLightbox('${url}')">
                <img src="${url}" alt="Prévia">
              </div>
            `).join('')}
          </div>
        `;
      }

      let blocoSobre = '';
      if (p.descricao_longa && p.descricao_longa.trim() !== '') {
        blocoSobre = `
          <div class="divisor"></div>
          <h2 class="secao-titulo">Sobre este material</h2>
          <p class="secao-sub">Tudo que você precisa saber</p>
          <div class="sobre-texto">${p.descricao_longa}</div>
        `;
      }

      conteudo.innerHTML = `
        <div class="box">
          <div class="capa-grande">
            ${p.capa_url ? `<img src="${p.capa_url}" alt="${p.titulo}">` : '📖'}
          </div>
          <div class="info">
            <div class="badge">${tipoLabel(p.tipo)}</div>
            <h1>${p.titulo}</h1>
            <p class="preco-grande">${precoBR(p.preco_cents)}</p>
            <div class="descricao-curta">${p.descricao_curta || ''}</div>
            <button class="btn-comprar" id="btn">Comprar agora</button>
            <p class="aviso">Após o pagamento, o produto fica disponível na sua estante pessoal.</p>
          </div>
        </div>

        ${blocoPrevia}
        ${blocoSobre}
      `;

      document.getElementById('btn').addEventListener('click', () => {
        if (token && userRaw) {
          alert('Você já está logado! Próximo passo: integrar com o Mercado Pago pra finalizar a compra.');
        } else {
          window.location.href = 'entrar.html';
        }
      });

    } catch (e) {
      conteudo.innerHTML = '<p class="loading">Erro ao carregar.</p>';
    }
  }

  carregar();
</script>

</body>
</html>
